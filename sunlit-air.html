<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sunlit Air</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1838;touch-action:none;
  font-family:"Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#8cc8ff}
#scene,#fx{position:absolute;left:0;top:0;width:1600px;height:900px}
#fx{pointer-events:none;z-index:60}
.abs{position:absolute}
.full{position:absolute;left:0;top:0;width:100%;height:100%}
svg{display:block;overflow:visible}

/* glowing outlined text, sits right on the background */
.tx{--o:#16235a;--g:rgba(255,206,64,.85);color:#fff;font-weight:900;line-height:1.12;letter-spacing:.5px;
  text-shadow:-4px -4px 0 var(--o),4px -4px 0 var(--o),-4px 4px 0 var(--o),4px 4px 0 var(--o),
  0 -5px 0 var(--o),0 5px 0 var(--o),-5px 0 0 var(--o),5px 0 0 var(--o),0 0 22px var(--g),0 8px 16px rgba(0,0,0,.35)}
.tx.yel{color:#ffd83d}
.tx.pink{color:#ffe1f1;--o:#8a1d63;--g:rgba(255,120,200,.9)}
.tx.purp{color:#f1e2ff;--o:#4a1d8a;--g:rgba(190,120,255,.9)}
.tx.thin{text-shadow:-3px -3px 0 var(--o),3px -3px 0 var(--o),-3px 3px 0 var(--o),3px 3px 0 var(--o),0 -3px 0 var(--o),0 3px 0 var(--o),-3px 0 0 var(--o),3px 0 0 var(--o),0 0 14px var(--g)}
.tx.red{color:#ff5a6e;--o:#fff;--g:rgba(255,80,100,.9)}
.tx.green{color:#5df08a;--o:#0d4a24;--g:rgba(90,255,140,.8)}

.btn{position:absolute;padding:14px 40px;border-radius:999px;background:linear-gradient(#fff1a0,#ffc21a 60%,#f5a800);
  color:#16235a;font-weight:900;font-size:42px;border:5px solid #16235a;box-shadow:0 8px 0 #16235a,0 0 28px rgba(255,214,77,.75);
  cursor:pointer;white-space:nowrap;transition:transform .08s,box-shadow .08s;font-family:inherit;z-index:20}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #16235a,0 0 28px rgba(255,214,77,.75)}
.btn.navy{background:linear-gradient(#4a68c8,#1b2a6b);color:#fff;border-color:#ffd83d}
.btn.sm{font-size:30px;padding:8px 26px;border-width:4px;box-shadow:0 6px 0 #16235a}
.btn.pulse{animation:pulse 1s ease-in-out infinite}

#hud{position:absolute;right:12px;top:10px;display:flex;gap:10px;z-index:100}
.hb{width:58px;height:58px;border-radius:50%;background:rgba(22,35,90,.72);border:3px solid #ffd83d;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hb:active{transform:scale(.9)}
.hb svg{width:30px;height:30px}

.nextb{position:absolute;width:104px;height:104px;border-radius:50%;cursor:pointer;z-index:30;
  background:radial-gradient(circle at 40% 35%,#fffbe0,#ffd21f 55%,#f2a100);border:5px solid #16235a;
  box-shadow:0 0 34px #ffd83d,0 7px 0 #16235a;display:flex;align-items:center;justify-content:center;animation:pulse 1.1s ease-in-out infinite}
.nextb:active{transform:scale(.92)}
.nextb.off{display:none}

@keyframes pop{0%{transform:scale(0)}65%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes popc{0%{transform:translate(-50%,-50%) scale(0)}65%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1)}100%{transform:translateY(-230px) scale(1.1);opacity:0}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),1050px) rotate(var(--r))}}
@keyframes slideL{from{transform:translateX(-700px)}to{transform:translateX(0)}}
@keyframes slideR{from{transform:translateX(700px)}to{transform:translateX(0)}}
@keyframes outR{to{transform:translateX(1300px)}}
@keyframes stampIn{0%{transform:scale(3.2) rotate(-30deg);opacity:0}55%{transform:scale(.88) rotate(-12deg);opacity:1}75%{transform:scale(1.05) rotate(-12deg)}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes flyAcross{0%{transform:translate(-520px,140px) rotate(-7deg)}100%{transform:translate(1750px,-170px) rotate(-7deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-300px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
@keyframes glowp{0%,100%{filter:drop-shadow(0 0 6px #ffd83d)}50%{filter:drop-shadow(0 0 22px #ffd83d)}}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(60px)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-26px)}100%{transform:translateY(0)}}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(30px,-60px);opacity:0}}
@keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes takeoff{0%{transform:translate(-460px,610px) rotate(0)}45%{transform:translate(520px,610px) rotate(-2deg)}100%{transform:translate(1750px,-160px) rotate(-17deg)}}
@keyframes land{0%{transform:translate(-460px,40px) rotate(9deg) scale(1)}100%{transform:translate(560px,420px) rotate(2deg) scale(.75)}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes drumL{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes drumR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(0)}}
@keyframes belly{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.96)}}

.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.bobbing{animation:bob 1.6s ease-in-out infinite}
.shake{animation:shake .45s}
.jump{animation:jump .35s}

/* Part 1 */
.bitem{position:absolute;left:0;top:0;width:170px;height:200px;cursor:grab;touch-action:none;z-index:5}
.bitem.held{z-index:40;filter:drop-shadow(0 12px 10px rgba(0,0,0,.35))}
.bitem .bl{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:32px;white-space:nowrap;pointer-events:none}
.bitem .bi{position:absolute;left:10px;top:42px;width:150px;height:150px;animation:wob .5s ease-in-out infinite alternate;pointer-events:none}
.drawer{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:12px 14px}
.bitem.picked{z-index:40;filter:drop-shadow(0 0 12px #ffd83d) drop-shadow(0 0 4px #fff)}
.bitem.picked .bi{animation:pulse .5s ease-in-out infinite}
.dhit{z-index:4;cursor:pointer}
.mini{width:62px;height:62px;animation:pop .3s cubic-bezier(.3,1.6,.5,1) both}
.racc{position:absolute;left:0;top:0;width:190px;height:190px;z-index:30;cursor:pointer;touch-action:none}
.racc .rsay{position:absolute;left:50%;top:-46px;transform:translateX(-50%);font-size:34px;white-space:nowrap;pointer-events:none}
.racc .rhold{position:absolute;left:55px;top:105px;width:80px;height:80px;pointer-events:none}

/* Part 2 */
.lid{position:absolute;transition:transform .4s cubic-bezier(.5,0,.3,1.3),opacity .4s;transform-origin:50% 0}
.lid.open{transform:translateY(-40px) scaleY(.08);opacity:0}
.slot{position:absolute;width:118px;height:144px;transition:transform .2s}
.slot .si{position:absolute;left:5px;top:2px;width:108px;height:108px}
.slot.ghost .si{filter:brightness(0) invert(1);opacity:.42}
.slot .sl{position:absolute;left:-16px;top:104px;width:150px;text-align:center;font-size:30px;line-height:1;opacity:0;transition:opacity .2s}
.slot.ok .sl{opacity:1}
.slot .ck{position:absolute;right:-6px;top:-8px;width:44px;height:44px;border-radius:50%;background:#2ecc71;border:4px solid #fff;color:#fff;font-size:28px;font-weight:900;display:none;align-items:center;justify-content:center;box-shadow:0 0 12px #2ecc71}
.slot.ok .ck{display:flex;animation:pop .3s cubic-bezier(.3,1.6,.5,1) both}
.slot.hl{z-index:5}
.slot.hl .si{animation:pulse .6s ease-in-out infinite,glowp .6s ease-in-out infinite}
.slot .cnt{position:absolute;left:-6px;top:76px;font-size:28px}
.slot.out{transition:transform .6s cubic-bezier(.4,-0.3,.6,1),opacity .6s;transform:translate(700px,-700px) rotate(720deg);opacity:0}

/* Part 3 */
.seat{position:absolute;border-radius:12px 12px 8px 8px;background:linear-gradient(#3d5ab8,#1b2a6b);border:3px solid #0e173f;box-shadow:inset 0 5px 0 #ffd83d}
.seat .hd{position:absolute;left:4%;top:-8%;width:92%;height:92%}
.seat .sb{position:absolute;left:-3px;right:-3px;bottom:16%;height:9px;background:#ffd83d;border:2px solid #16235a;border-radius:4px;transform:scaleX(0);transition:transform .25s}
.seat.belted .sb{transform:scaleX(1)}

/* Part 4 */
.citem{position:absolute;width:104px;height:128px;cursor:grab;touch-action:none}
.citem .ci{position:absolute;left:4px;top:0;width:96px;height:96px;pointer-events:none}
.citem .cl{position:absolute;left:-20px;width:144px;top:94px;text-align:center;font-size:22px;line-height:1;pointer-events:none}
.ghost{position:absolute;left:0;top:0;width:130px;height:130px;z-index:45;pointer-events:none;filter:drop-shadow(0 14px 10px rgba(0,0,0,.35))}
.blank{display:inline-block;width:84px;height:84px;vertical-align:middle;margin:-10px 6px 0;border-bottom:6px solid #ffd83d;border-radius:4px;filter:drop-shadow(0 0 10px rgba(255,216,61,.9))}
.spk{font-size:30px;margin-right:10px}
.oslot{position:absolute;width:104px;height:104px}
.oslot.need{animation:pulse .7s ease-in-out infinite}
.oslot .ck{position:absolute;right:-8px;bottom:-6px;width:46px;height:46px;border-radius:50%;background:#2ecc71;border:4px solid #fff;color:#fff;font-size:28px;font-weight:900;display:none;align-items:center;justify-content:center}
.oslot.done .ck{display:flex;animation:pop .3s cubic-bezier(.3,1.6,.5,1) both}
.oslot.done .oi{opacity:.55}
.pass{position:absolute;cursor:pointer;z-index:25}
.pass.want{animation:pulse .7s ease-in-out infinite}
.bucklez{cursor:pointer}
.calllit{animation:glowp .5s ease-in-out infinite}
.drumming .armL{transform-box:fill-box;transform-origin:20% 10%;animation:drumL .18s linear infinite}
.drumming .armR{transform-box:fill-box;transform-origin:80% 10%;animation:drumR .18s linear infinite}
.drumming .belly{transform-box:fill-box;transform-origin:50% 50%;animation:belly .18s linear infinite}
.zz{animation:zz 2s ease-out infinite}
.wv{transform-box:fill-box;transform-origin:50% 100%;animation:wave .35s ease-in-out infinite alternate}
.card{position:absolute;width:290px;height:420px;border-radius:28px;cursor:pointer;background:linear-gradient(#ffffff,#eaf0ff);border:5px solid #16235a;
  box-shadow:0 10px 0 #16235a,0 0 30px rgba(255,216,61,.55);overflow:hidden;transition:transform .1s}
.card:active{transform:translateY(6px) scale(.98)}
.pinx{position:absolute;width:170px;height:170px;cursor:pointer}
.pinx .rg{position:absolute;left:15px;top:15px;width:140px;height:140px;border-radius:50%;border:6px solid #ffd83d;animation:ring 1.2s ease-out infinite}
.ttl{position:absolute;left:0;top:70px;width:1600px;display:flex;justify-content:center;font-size:200px;font-weight:900;line-height:1;letter-spacing:4px;font-family:"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",sans-serif;animation:bob 3s ease-in-out infinite}
.ttl>span{position:relative;display:inline-block;background:linear-gradient(#fffbd0,#ffe14d 40%,#ffb020 75%,#ff8a1a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(5px 0 0 #16235a) drop-shadow(-5px 0 0 #16235a) drop-shadow(0 6px 0 #16235a) drop-shadow(0 -5px 0 #16235a) drop-shadow(0 10px 0 #0d1838) drop-shadow(0 0 24px rgba(255,190,60,.8));
  animation:dropIn .6s cubic-bezier(.3,1.6,.5,1) both}
.ttl>span.sp{width:60px}
.ttl .dot{position:absolute;left:50%;top:-30px;width:74px;height:74px;transform:translateX(-50%);filter:none}
@keyframes dropIn{0%{transform:translateY(-260px) rotate(-20deg);opacity:0}100%{transform:translateY(0) rotate(0);opacity:1}}
.ribbon{position:absolute;left:520px;top:300px;width:560px;height:96px}
.gline{position:relative;display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:4px 10px;border-radius:20px;cursor:pointer;transition:background .2s}
.gline.on{background:rgba(255,216,61,.22);box-shadow:0 0 0 4px #ffd83d}
.gsp{flex:0 0 190px;display:flex;align-items:center;gap:6px;height:50px;padding:0 14px 0 6px;border-radius:25px;font-size:26px;font-weight:900;color:#16235a;border:3px solid #16235a}
.gsp svg{width:40px;height:40px}
.gsp.a{background:linear-gradient(#fff1a0,#ffc21a)}
.gsp.p{background:linear-gradient(#ffe0f0,#ff9ad0)}
.gtx{position:relative;font-size:46px;line-height:1.1}
.veil{position:absolute;left:0;top:0;width:1600px;height:900px;background:radial-gradient(ellipse at center,rgba(13,24,56,.25),rgba(13,24,56,.7))}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<linearGradient id="yelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a6"/><stop offset="1" stop-color="#ffbd14"/></linearGradient>
<linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7c4"/><stop offset=".5" stop-color="#ffd23a"/><stop offset="1" stop-color="#c98a00"/></linearGradient>
<linearGradient id="navyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b57b0"/><stop offset="1" stop-color="#16235a"/></linearGradient>
<linearGradient id="hairA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d4478"/><stop offset="1" stop-color="#1c1730"/></linearGradient>
<linearGradient id="hairPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2e4"/><stop offset=".45" stop-color="#ff6fb5"/><stop offset="1" stop-color="#d63f8f"/></linearGradient>
<linearGradient id="hairBrown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4632"/><stop offset="1" stop-color="#25150d"/></linearGradient>
<linearGradient id="purpG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a66cf0"/><stop offset="1" stop-color="#5326a8"/></linearGradient>
<linearGradient id="metalG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#97a2b8"/></linearGradient>
<linearGradient id="ir_p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1250"/><stop offset=".5" stop-color="#7c4ad1"/><stop offset="1" stop-color="#ead4ff"/></linearGradient>
<linearGradient id="ir_a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2006"/><stop offset=".5" stop-color="#c9741c"/><stop offset="1" stop-color="#ffe09a"/></linearGradient>
<linearGradient id="ir_k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d0f5e"/><stop offset=".5" stop-color="#c04fd8"/><stop offset="1" stop-color="#ffd0f2"/></linearGradient>
<linearGradient id="ir_b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a140a"/><stop offset=".55" stop-color="#8a5530"/><stop offset="1" stop-color="#e8bb88"/></linearGradient>
<linearGradient id="ir_g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d3a2a"/><stop offset=".55" stop-color="#2fa36a"/><stop offset="1" stop-color="#b8f5d4"/></linearGradient>
<linearGradient id="ir_u" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2050"/><stop offset=".55" stop-color="#3a7ad8"/><stop offset="1" stop-color="#c8e4ff"/></linearGradient>
<radialGradient id="shadowG" cx=".45" cy=".7" r=".7"><stop offset="0" stop-color="#ff7ad9"/><stop offset=".55" stop-color="#b45cff" stop-opacity=".85"/><stop offset="1" stop-color="#7a3ad8" stop-opacity="0"/></radialGradient>
<linearGradient id="shadowL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b45cff" stop-opacity=".25"/><stop offset=".5" stop-color="#c86aff" stop-opacity=".85"/><stop offset="1" stop-color="#ff7ad9"/></linearGradient>
<linearGradient id="boxG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3ad6e"/><stop offset="1" stop-color="#c08446"/></linearGradient>
<linearGradient id="cartG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34509e"/><stop offset="1" stop-color="#18245c"/></linearGradient>
<linearGradient id="steelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fc"/><stop offset="1" stop-color="#b9c2d4"/></linearGradient>
</defs>
</svg>
<div id="stage"><div id="scene"></div><div id="fx"></div>
<div id="hud">
  <div class="hb" id="hbFull" title="Full screen"><svg viewBox="0 0 32 32"><path d="M4 12V4h8M20 4h8v8M28 20v8h-8M12 28H4v-8" stroke="#ffd83d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="hb" id="hbHome" title="Menu"><svg viewBox="0 0 32 32"><path d="M4 15L16 4l12 11M8 13v14h6v-8h4v8h6V13" stroke="#ffd83d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="hb" id="hbSnd" title="Sound"></div>
  <div class="hb" id="hbSkip" title="Skip / Next"><svg viewBox="0 0 32 32"><path d="M5 6l11 10L5 26zM16 6l11 10-11 10z" fill="#ffd83d"/></svg></div>
</div>
</div>
<script>
/* ================= ART: all drawn in SVG ================= */
const OL='#1c1836';
const DK='#2a1838';
function sv(vb,inner,cls){return `<svg viewBox="${vb}" class="${cls||'full'}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;}
function sparkle(x,y,r,fill,op){return `<path d="M${x} ${y-r}Q${x+r*.16} ${y-r*.16} ${x+r} ${y}Q${x+r*.16} ${y+r*.16} ${x} ${y+r}Q${x-r*.16} ${y+r*.16} ${x-r} ${y}Q${x-r*.16} ${y-r*.16} ${x} ${y-r}Z" fill="${fill||'#fff'}" opacity="${op==null?1:op}"/>`;}
function heartP(x,y,s,fill){return `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -4C-4 -12 -16 -10 -16 -1C-16 7 -6 12 0 17C6 12 16 7 16 -1C16 -10 4 -12 0 -4Z" fill="${fill}" stroke="#fff" stroke-width="2"/>`;}
function sunG(x,y,r,face){
  let rays='';
  for(let i=0;i<12;i++){const a=i*Math.PI/6,a1=a-.2,a2=a+.2;
    rays+=`${x+Math.cos(a1)*r*1.08},${y+Math.sin(a1)*r*1.08} ${x+Math.cos(a)*r*1.6},${y+Math.sin(a)*r*1.6} ${x+Math.cos(a2)*r*1.08},${y+Math.sin(a2)*r*1.08} `;}
  let s=`<polygon points="${rays}" fill="#ffc21a" stroke="#c98a00" stroke-width="${Math.max(1,r*.06)}" stroke-linejoin="round"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#yelG)" stroke="#c98a00" stroke-width="${Math.max(1.2,r*.1)}"/>`;
  s+=`<ellipse cx="${x-r*.32}" cy="${y-r*.36}" rx="${r*.3}" ry="${r*.2}" fill="#fff" opacity=".7"/>`;
  if(face) s+=`<circle cx="${x-r*.32}" cy="${y}" r="${r*.1}" fill="${DK}"/><circle cx="${x+r*.32}" cy="${y}" r="${r*.1}" fill="${DK}"/><path d="M${x-r*.2} ${y+r*.25}Q${x} ${y+r*.45} ${x+r*.2} ${y+r*.25}" stroke="${DK}" stroke-width="${r*.08}" fill="none" stroke-linecap="round"/>`;
  return s;
}
function cloud(x,y,s,fill,shade){
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 40Q-6 12 24 12Q32 -14 64 -4Q86 -26 112 0Q142 -6 142 24Q164 28 156 50H6Q-12 50 0 40Z" fill="${fill}"/><path d="M14 46Q70 34 150 46" stroke="${shade}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".6"/></g>`;
}

/* --- anime face parts --- */
function eye(x,y,sc,ir,mood,side,lid,sp){
  let s='';
  if(mood==='happy'){

let AC=null,MASTER=null,NOISE=null,muted=false;

  if(n.nodeType!==1||n.nodeName==='SCRIPT'||n.nodeName==='STYLE')return;const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;while((t=w.nextNode()))if(t.nodeValue.indexOf('a')>=0)t.nodeValue=t.nodeValue.replace(/a/g,'\u0251');}

  update(dt){

      o.drag={id:e.pointerId,ox:p.x-o.x,oy:p.y-o.y,sx:p.x,sy:p.y};try{o.el.setPointerCapture(e.pointerId);}catch(_){}o.el.classList.add('held');});
    o.el.addEventListener('pointermove',e=>{if(!o.drag||e.pointerId!==o.drag.id)return;const p=toStage(e);o.x=p.x-o.drag.ox;o.y=p.y-o.drag.oy;this.place(o);});
    const up=e=>{if(!o.drag||e.pointerId!==o.drag.id)return;const p=toStage(e),d=o.drag;o.drag=null;o.el.classList.remove('held');

      if(this.sel===o)this.unselect();

      if(di>=0)this.tryDrop(o,di);else this.back(o);};

  },
  place(o){o.el.style.transform=`translate(${o.x}px,${o.y}px)`;},
  drawerAt(x,y){if(y<500||y>890)return -1;for(let i=0;i<3;i++){const dx=250+i*380;if(x>=dx-15&&x<=dx+365)return i;}return -1;},

    later(1700,()=>{pp.remove();this.served++;this.renderProg();cb();});
  },
  skip(){
    const st=this.st;if(!st||this.busy)return;
    if(st.act==='pass')this.checkPass();
    else if(st.act==='belt')this.buckle();
    else if(st.act==='give'){const t=st.items.find(x=>!this.got.has(x));if(t){const g=el('ghost',icon(t));scene.appendChild(g);g.style.transform='translate(1250px,500px)';reflow(g);this.correct(t,g,st);}}
    else this.next();
  }
};

/* ================= LANDING ================= */
SCR.landing={
  enter(k){
    const c=CTRY[k];G.stamps[k]=true;const all=['jp','kr','ph'].every(x=>G.stamps[x]);this.all=all;
    scene.innerHTML=`<svg viewBox="0 0 600 300" class="full" preserveAspectRatio="xMidYMid slice">${viewSVG(k,'lv')}</svg>`;
    const pl=box(scene,'',planeSide(),0,0,460,175);pl.style.animation='land 1.4s cubic-bezier(.3,.6,.4,1) forwards';
    SFX.whoosh();
    const t=tx(scene,k==='ph'?'Welcome to the Philippines!':`Welcome to ${c.name}!`,0,30,92,{w:1600,cls:'yel'});t.classList.add('pop');
    if(k==='ph'){
      box(scene,'pop',sv('0 0 700 130',`<path d="M10 20H690L660 65L690 110H10L40 65Z" fill="#ff6b8a" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><text x="350" y="86" font-size="62" font-weight="900" text-anchor="middle" fill="#fff" stroke="#8a1d63" stroke-width="8" paint-order="stroke" font-family="Arial Rounded MT Bold,Nunito,Arial,sans-serif">Welcome home!</text>${heartP(70,64,1.2,'#ffd83d')}${heartP(630,64,1.2,'#ffd83d')}`),40,470,700,130);
      const fam=[{hair:'#9a9aa8',shirt:'#b45cff',skin:'#e8b48a',style:'bun',glasses:1,x:30,s:1},{hair:'#2a1d18',shirt:'#e8475f',skin:'#e8b48a',style:'bun',x:170,s:1.05},
        {hair:'#1c1730',shirt:'#3a8be8',skin:'#d9a070',style:'short',x:320,s:1.1},{hair:'#2a1d18',shirt:'#ffc21a',skin:'#f3c9a2',style:'spiky',x:470,s:.8},{hair:'#3a2418',shirt:'#5df08a',skin:'#f3c9a2',style:'long',x:590,s:.85}];
      fam.forEach((f,i)=>{const w=160*f.s,h=250*f.s;box(scene,'',chibi(Object.assign({wave:true},f)),f.x,900-h-10,w,h);});
      later(900,()=>{tx(scene,"“Ma, I'm home!”",780,560,60,{cls:'pink'}).classList.add('pop');});
    }
    later(1250,()=>{const s=box(scene,'',stampSVG(c.name.toUpperCase(),'ARRIVED ✈',c.col,1),1130,190,400,400);s.style.animation='stampIn .45s ease-out both';SFX.stamp();
      later(250,()=>{SFX.cheer();confetti(70);});});
    later(1700,()=>{
      if(all)btn(scene,'Golden Wings! ▶',1090,760,()=>go('gold'),'pulse');
      else btn(scene,'Back to map ▶',1110,760,()=>go('map'),'pulse');
    });
  },
  skip(){go(this.all?'gold':'map');}
};

/* ================= GOLDEN WINGS ================= */
SCR.gold={
  enter(){
    scene.innerHTML=bgGold();
    const w=box(scene,'pop',wingsSVG(),460,30,680,340);w.style.animationDelay='.1s';
    const a=tx(scene,'Golden Wings,',0,380,120,{w:1600,cls:'yel'});a.classList.add('pop');
    const b=tx(scene,'Best Crew!',0,510,130,{w:1600});b.classList.add('pop');b.style.animationDelay='.25s';
    box(scene,'bobbing',aria('thumbs'),30,330,300,540);
    [['tanuki',CTRY.jp.pas[0]],['idol',CTRY.kr.pas[0]],['ofw',CTRY.ph.pas[0]]].forEach((p,i)=>{
      const e=box(scene,'pop',PASSART[p[0]](p[1],'happy',p[0]==='idol'?'heart':'normal'),1090+i*165,640,190,247);e.style.animationDelay=(.3+i*.12)+'s';});
    SFX.cheer();confetti(90);later(1300,()=>{confetti(60);SFX.sparkle();});later(2600,()=>{confetti(60);SFX.cheer();});
    btn(scene,'⌂ Menu',600,760,()=>go('menu'),'navy sm');
    btn(scene,'✈ Fly again',820,760,()=>{G.stamps={};go('map');},'sm');
  },
  skip(){go('menu');}
};

/* ================= BOOT ================= */
document.addEventListener('pointerdown',()=>ac(),{once:true});
go('title');
</script>
