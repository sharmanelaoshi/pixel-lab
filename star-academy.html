<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Academy: Club Tryouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--font:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;--pink:#ff3df2;--cyan:#2de2ff;--gold:#ffe14d;--green:#3dff8b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--font);-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0a0320;color:#fff}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
#bg{z-index:0;overflow:hidden}
#game{z-index:1;display:none}
#hud{z-index:4;pointer-events:none;display:none}
#ui{z-index:5;pointer-events:none}
#ui .screen{pointer-events:auto}
#fx{z-index:8;pointer-events:none}
#controls{position:absolute;z-index:20;top:14px;right:14px;display:flex;gap:12px}
.cbtn{width:82px;height:82px;border-radius:24px;border:2px solid rgba(255,255,255,.28);background:rgba(12,6,34,.6);color:#fff;font-size:40px;line-height:1;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.4);transition:transform .1s}
.cbtn:active{transform:scale(.9)}
.cbtn.off{opacity:.45}
#toast{position:absolute;z-index:25;left:50%;top:120px;transform:translateX(-50%) translateY(-30px);background:rgba(12,6,34,.92);border:3px solid var(--cyan);border-radius:30px;padding:16px 40px;font-size:40px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 0 30px rgba(45,226,255,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{z-index:30;background:rgba(5,2,18,.78);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{font-size:52px;font-weight:800;color:#fff;border:none;border-radius:999px;padding:16px 64px;background:linear-gradient(135deg,var(--a,#ff3df2),var(--b,#7a2cff));box-shadow:0 0 0 4px rgba(255,255,255,.18),0 12px 40px -6px var(--a,#ff3df2);text-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .12s;letter-spacing:1px;line-height:1.25}
.btn:active{transform:scale(.94)}
.btn.big{font-size:70px;padding:22px 96px}
.btn.green{--a:#2bff88;--b:#00a06a}.btn.orange{--a:#ffb627;--b:#ff5e3a}.btn.cyan{--a:#2de2ff;--b:#3a5bff}.btn.gold{--a:#ffe14d;--b:#ff9d00;color:#3a2000;text-shadow:none}.btn.gray{--a:#6b6f8f;--b:#3b3f5f}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:scrIn .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes scrIn{from{opacity:0;transform:scale(.94)}}
.panel{background:rgba(16,8,44,.82);border:3px solid rgba(255,255,255,.16);border-radius:44px;padding:40px 60px;box-shadow:0 0 70px rgba(122,44,255,.4),inset 0 0 40px rgba(255,255,255,.04);backdrop-filter:blur(8px)}
.neon{color:#fff;text-shadow:0 0 8px var(--c,#ff3df2),0 0 26px var(--c,#ff3df2),0 0 56px var(--c,#ff3df2)}
.h1{font-size:96px;font-weight:800;line-height:1;text-align:center;margin:0}
.h2{font-size:64px;font-weight:800;line-height:1.1;text-align:center;margin:0}
.h3{font-size:44px;font-weight:700;line-height:1.2;text-align:center;margin:0;opacity:.92}
.row{display:flex;align-items:center;justify-content:center;gap:40px}
.col{display:flex;flex-direction:column;align-items:center;gap:24px}
.av-svg{width:100%;height:100%;display:block;overflow:visible}
/* ===== backgrounds ===== */
#bg .stars{position:absolute;inset:0}
#bg .star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.5)}}
#bg.grid{background:linear-gradient(#07021a 0%,#1a0745 45%,#4a0f6e 62%,#12042c 63%,#070114 100%)}
#bg.grid .sun{position:absolute;left:50%;top:300px;width:560px;height:380px;margin-left:-280px;border-radius:280px 280px 0 0;background:linear-gradient(#ffe14d,#ff7a3d 45%,#ff3df2 80%);-webkit-mask:repeating-linear-gradient(to bottom,#000 0 30px,transparent 30px 38px);mask:repeating-linear-gradient(to bottom,#000 0 30px,transparent 30px 38px);opacity:.6;filter:drop-shadow(0 0 40px #ff3df2)}
#bg.grid .floor{position:absolute;left:-60%;width:220%;top:680px;height:900px;background-image:linear-gradient(rgba(45,226,255,.75) 3px,transparent 3px),linear-gradient(90deg,rgba(255,61,242,.75) 3px,transparent 3px);background-size:140px 140px;transform:perspective(420px) rotateX(64deg);transform-origin:50% 0;animation:gridmove 1.6s linear infinite;-webkit-mask:linear-gradient(transparent,#000 30%);mask:linear-gradient(transparent,#000 30%)}
@keyframes gridmove{to{background-position:0 140px}}
#bg.club{background:radial-gradient(ellipse at 50% 0%,var(--c) 0%,transparent 55%),radial-gradient(ellipse at 50% 120%,var(--c2) 0%,transparent 55%),#090320}
#bg .beam{position:absolute;top:-200px;width:420px;height:1500px;background:linear-gradient(rgba(255,255,255,.35),transparent 80%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen;filter:blur(6px)}
#bg .beam.l{left:200px;animation:sweepL 4s ease-in-out infinite alternate}
#bg .beam.r{right:200px;animation:sweepR 4s ease-in-out infinite alternate}
@keyframes sweepL{from{transform:rotate(-25deg)}to{transform:rotate(15deg)}}
@keyframes sweepR{from{transform:rotate(25deg)}to{transform:rotate(-15deg)}}
/* ===== setup ===== */
.logo{position:relative;text-align:center}
.logo .star-big{font-size:80px;display:inline-block;animation:spin 6s linear infinite;filter:drop-shadow(0 0 30px #ffe14d)}
@keyframes spin{to{transform:rotate(360deg)}}
.logo .t1{font-size:128px;font-weight:800;line-height:.9;letter-spacing:4px;background:linear-gradient(90deg,#ffe14d,#ff3df2,#2de2ff,#ffe14d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4)) drop-shadow(0 0 30px rgba(255,61,242,.6))}
@keyframes shine{to{background-position:300% 0}}
.logo .t2{font-size:62px;font-weight:800;letter-spacing:18px;color:#fff;text-shadow:0 0 20px #2de2ff,0 0 50px #2de2ff;margin-top:6px}
.setting{display:flex;align-items:center;gap:24px;font-size:46px;font-weight:700}
.stepper{display:flex;align-items:center;gap:18px}
.stepper button{width:96px;height:96px;border-radius:50%;border:none;font-size:64px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2de2ff,#3a5bff);box-shadow:0 0 20px rgba(45,226,255,.6)}
.stepper .num{font-size:84px;font-weight:800;min-width:120px;text-align:center;color:#ffe14d;text-shadow:0 0 20px #ff9d00}
.toggle{display:flex;border-radius:999px;background:rgba(255,255,255,.08);padding:6px;gap:6px}
.toggle button{border:none;border-radius:999px;font-size:38px;font-weight:800;padding:14px 34px;color:#fff;background:transparent}
.toggle button.on{background:linear-gradient(135deg,#ff3df2,#7a2cff);box-shadow:0 0 20px rgba(255,61,242,.6)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:14px 50px;margin:20px 0}
.names .pr{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800}
.names .pr span{width:110px;color:#ffe14d}
.names input{width:250px;font-family:inherit;font-size:34px;font-weight:700;padding:6px 16px;border-radius:18px;border:3px solid rgba(45,226,255,.5);background:rgba(0,0,0,.4);color:#fff;outline:none;user-select:text;-webkit-user-select:text}
.names input:focus{border-color:#ff3df2;box-shadow:0 0 16px #ff3df2}
/* ===== courtyard (school club orientation, daytime) ===== */
.court{justify-content:flex-start}
.court .sky{position:absolute;inset:0;background:linear-gradient(#3aa8ff 0%,#86d0ff 40%,#d4f0ff 60%)}
.court .sunny{position:absolute;left:480px;top:110px;width:96px;height:96px;border-radius:50%;background:#ffe14d;box-shadow:0 0 50px #ffe14d,0 0 120px rgba(255,225,77,.6)}
.court .cloud{position:absolute;height:56px;border-radius:999px;background:#fff;opacity:.95;animation:drift linear infinite}
.court .cloud::before,.court .cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.court .cloud::before{width:70px;height:70px;left:22px;top:-34px}.court .cloud::after{width:90px;height:90px;left:70px;top:-50px}
@keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(2300px)}}
.court .ground{position:absolute;left:0;right:0;top:610px;bottom:0;background:linear-gradient(#d9dde8,#b9c0d4);overflow:hidden;border-top:10px solid #7ccf5a}
.court .ground::after{content:'';position:absolute;left:-50%;width:200%;top:0;height:900px;background-image:linear-gradient(rgba(80,90,130,.18) 3px,transparent 3px),linear-gradient(90deg,rgba(80,90,130,.18) 3px,transparent 3px);background-size:160px 160px;transform:perspective(500px) rotateX(60deg);transform-origin:50% 0}
.court svg.deco{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.topbar{position:absolute;left:24px;top:22px;z-index:3}
.ribbon{position:relative;display:inline-block;font-size:38px;font-weight:800;color:#fff;padding:10px 34px;background:linear-gradient(135deg,#ff3df2,#7a2cff);border-radius:14px;box-shadow:0 6px 0 #4a1a8a,0 0 24px rgba(255,61,242,.5);text-shadow:0 3px 0 rgba(0,0,0,.25);transform:rotate(-2deg)}
.ribbon small{display:block;font-size:24px;letter-spacing:3px;opacity:.9;line-height:1}
.progress{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;text-align:center;background:rgba(16,8,44,.85);padding:4px 34px 12px;border-radius:28px;border:3px solid rgba(255,255,255,.3)}
.progress .pt{font-size:46px;font-weight:800;color:#fff;text-shadow:0 0 16px #2de2ff}
.progress .dots{display:flex;gap:10px;justify-content:center;margin-top:2px}
.progress .dot{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4)}
.progress .dot.done{background:#3dff8b;box-shadow:0 0 12px #3dff8b;border-color:#fff}
.progress .dot.now{background:#ffe14d;box-shadow:0 0 16px #ffe14d;animation:pulse 1s infinite}
.pairbar{position:absolute;left:50%;top:136px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:26px;padding:10px 40px;border-radius:999px;background:rgba(16,8,44,.9);border:4px solid #ffe14d;box-shadow:0 8px 0 rgba(0,0,0,.2),0 0 30px rgba(255,225,77,.5);white-space:nowrap}
.pairbar .pav{width:86px;height:100px}
.pairbar .pn{font-size:50px;font-weight:800}
.pairbar .amp{font-size:44px;color:#ffe14d;font-weight:800}
.pairbar .tap{font-size:44px;font-weight:800;color:#ffe14d;margin-left:10px;animation:pulse 1.2s infinite}
.booth{position:absolute;top:290px;width:430px;height:770px;--c:#fff;--c2:#888;transition:transform .2s}
.booth.pick{cursor:pointer}
.booth.pick:active{transform:scale(.97)}
.booth .leg{position:absolute;top:200px;height:340px;width:14px;background:linear-gradient(90deg,#8a5a2b,#c08a50);border-radius:6px}
.booth .leg.l{left:70px}.booth .leg.r{right:70px}
.booth .poster{position:absolute;left:26px;right:26px;top:0;height:228px;border-radius:22px;background:#fff;border:6px solid var(--c);box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;color:#1a0b3a}
.booth.pick .poster{animation:posterGlow 1.4s ease-in-out infinite}
@keyframes posterGlow{50%{box-shadow:0 10px 0 rgba(0,0,0,.18),0 0 40px 6px var(--c)}}
.booth .poster .hd{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;font-size:var(--nf,52px);font-weight:800;text-align:center;line-height:1.25;padding:2px 0 4px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.booth .poster .bd{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 14px}
.booth .poster .em{font-size:84px;line-height:1}
.booth .poster .act{font-size:32px;font-weight:800;line-height:1.1}
.booth .poster .act small{display:block;font-size:24px;color:var(--c2)}
.booth .pin{position:absolute;top:8px;width:18px;height:18px;border-radius:50%;background:#ff4f5e;box-shadow:0 2px 0 rgba(0,0,0,.3);z-index:2}
.booth .pin.l{left:40px}.booth .pin.r{right:40px}
.booth .cnt{position:absolute;right:-8px;top:150px;width:84px;height:84px;border-radius:50%;background:#ffe14d;color:#14062e;font-size:50px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.2);border:5px solid #fff;z-index:3;transform:rotate(8deg)}
.booth .crew{position:absolute;left:10px;right:10px;top:236px;height:300px;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:0 6px;z-index:1}
.booth .crew .mn{color:#fff;background:rgba(16,8,44,.8);border-radius:10px;padding:0 8px;text-shadow:none}
.booth .tbl{position:absolute;left:0;right:0;top:530px;height:240px;z-index:2}
.booth .tbl .top{position:absolute;left:0;right:0;top:0;height:26px;border-radius:8px;background:linear-gradient(#e8b878,#b9824a);box-shadow:0 4px 0 #8a5a2b}
.booth .tbl .cloth{position:absolute;left:10px;right:10px;top:26px;height:190px;background:linear-gradient(var(--c),var(--c2));border-radius:0 0 18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;-webkit-mask:radial-gradient(circle at 20px 190px,transparent 19px,#000 20px) 0 0/40px 100%;mask:radial-gradient(circle at 20px 190px,transparent 19px,#000 20px) 0 0/40px 100%}
.booth .tbl .sheet{background:#fff;color:#1a0b3a;border-radius:10px;padding:6px 22px;font-size:34px;font-weight:800;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.booth .tbl .tapme{font-size:32px;font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap}
.booth .props{position:absolute;top:-56px;right:24px;font-size:54px;letter-spacing:4px;z-index:3}
.mem{display:flex;flex-direction:column;align-items:center;width:var(--s);animation:memIn .5s cubic-bezier(.2,1.6,.4,1) both}
.mem .avb{width:var(--s);height:calc(var(--s)*1.2);animation:idle 2.4s ease-in-out infinite}
.mem .mn{font-size:24px;font-weight:800;max-width:calc(var(--s) + 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.1;text-shadow:0 2px 0 #000}
.mem.pending{visibility:hidden;animation:none}
@keyframes memIn{from{transform:scale(0)}}
@keyframes idle{50%{transform:translateY(-6px)}}
.runner{position:absolute;z-index:6;width:120px;height:144px;transition:left 1.3s cubic-bezier(.45,.05,.4,1),top 1.3s cubic-bezier(.45,.05,.4,1),width 1.3s,height 1.3s;pointer-events:none}
.runner .avb{width:100%;height:100%;animation:run .22s ease-in-out infinite alternate}
@keyframes run{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-22px) rotate(6deg)}}
.donebar{position:absolute;left:50%;top:118px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:30px;padding:14px 30px 14px 46px;border-radius:999px;background:rgba(16,8,44,.9);border:3px solid #ffe14d;box-shadow:0 0 40px rgba(255,225,77,.6);white-space:nowrap}
.donebar .dt{font-size:44px;font-weight:800}
/* ===== coach ===== */
.coachwrap{position:absolute;left:90px;bottom:0;width:560px;height:760px;animation:coachIn .6s cubic-bezier(.2,1.4,.4,1)}
.coachwrap svg{width:100%;height:100%;animation:idle 2s ease-in-out infinite}
@keyframes coachIn{from{transform:translateX(-500px)}}
.bubble{position:absolute;left:640px;top:150px;width:1160px;background:#fff;color:#1a0b3a;border-radius:50px;padding:46px 60px;font-size:84px;font-weight:800;line-height:1.12;box-shadow:0 0 0 8px var(--c),0 0 60px var(--c);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.bubble::before{content:'';position:absolute;left:-60px;top:150px;border:40px solid transparent;border-right:70px solid #fff;border-left:0}
.bubble .who{display:flex;align-items:center;gap:20px;font-size:52px;color:#7a2cff;margin-bottom:10px}
.bubble .who .wav{width:90px;height:108px}
.bubble b{color:var(--cd,#d4148a)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.answers{position:absolute;left:640px;width:1160px;top:720px;display:flex;gap:40px;justify-content:center}
.answers .btn{font-size:66px;padding:26px 60px;min-width:520px}
.coachsay{position:absolute;left:640px;width:1160px;top:740px;text-align:center;font-size:76px;font-weight:800;color:#ffe14d;text-shadow:0 0 20px #ff9d00;animation:pop .4s}
/* ===== choose / cards ===== */
.pcard{width:520px;padding:30px;border-radius:44px;border:5px solid var(--c,#2de2ff);background:rgba(16,8,44,.85);box-shadow:0 0 40px var(--c,#2de2ff);display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;transition:transform .15s}
.pcard:active{transform:scale(.95)}
.pcard .pav{width:240px;height:288px}
.pcard .pn{font-size:68px;font-weight:800;line-height:1}
.pcard .sub{font-size:36px;font-weight:700;color:var(--c,#2de2ff)}
.howto{display:flex;flex-direction:column;gap:16px;margin:16px 0}
.howto div{font-size:46px;font-weight:700;display:flex;align-items:center;gap:20px}
.howto div span{font-size:58px;width:76px;text-align:center}
.chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.chip{font-size:34px;font-weight:800;padding:8px 24px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25)}
.chip.pos{border-color:#3dff8b;color:#3dff8b}.chip.neg{border-color:#ff5470;color:#ff7a8f}.chip.gold{border-color:#ffe14d;color:#ffe14d}
.bigscore{font-size:300px;font-weight:800;line-height:.9;color:#ffe14d;text-shadow:0 0 30px #ff9d00,0 10px 0 rgba(0,0,0,.4)}
/* lucky cards */
.cards{display:flex;gap:34px;perspective:1600px;margin-top:20px}
.lcard{width:300px;height:420px;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1),opacity .5s;cursor:pointer;animation:deal .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes deal{from{transform:translateY(400px) rotate(20deg);opacity:0}}
.lcard .face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lcard .back{background:linear-gradient(135deg,#7a2cff,#ff3df2);border:6px solid #fff;box-shadow:0 0 30px #ff3df2;font-size:150px;overflow:hidden}
.lcard .back::before{content:'';position:absolute;inset:16px;border-radius:20px;border:3px dashed rgba(255,255,255,.5)}
.lcard .back span{animation:spin 8s linear infinite;filter:drop-shadow(0 0 20px #ffe14d)}
.lcard .front{background:#fff;color:#1a0b3a;transform:rotateY(180deg);border:8px solid #ffe14d;box-shadow:0 0 50px #ffe14d;padding:20px}
.lcard.flipped{transform:translateX(var(--dx,0)) rotateY(180deg) scale(1.3);z-index:5}
.lcard.fade{opacity:0;pointer-events:none}
.lcard .front .ic{font-size:64px;line-height:1}
.lcard .front .ti{font-size:26px;font-weight:800;color:#d4148a;letter-spacing:2px}
.lcard .front .tx{font-size:30px;font-weight:800;line-height:1.2;margin-top:6px}
.hintbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1600px}
.hintbar .chip{font-size:28px;padding:4px 20px}
/* join roulette */
.rlt{display:flex;gap:30px;margin:30px 0}
.rlt .rc{width:320px;height:260px;border-radius:36px;border:5px solid var(--c);background:rgba(16,8,44,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:52px;font-weight:800;transition:transform .12s,box-shadow .12s;opacity:.55}
.rlt .rc .e{font-size:110px;line-height:1.1}
.rlt .rc.on{opacity:1;transform:scale(1.12);box-shadow:0 0 60px var(--c),inset 0 0 40px var(--c)}
.rlt .rc.win{animation:winpulse .6s ease-in-out infinite alternate}
@keyframes winpulse{to{transform:scale(1.2)}}
.rlt .rc small{font-size:28px;opacity:.85}
/* spotlight */
.spot-line{font-size:110px;font-weight:800;line-height:1.08;text-align:center;max-width:1700px}
.spot-line .hl{color:var(--c);text-shadow:0 0 30px var(--c)}

.board .br.top{box-shadow:0 0 40px var(--c);background:rgba(255,255,255,.16)}

.hud-tl .ring{width:120px;height:120px;position:relative}

@keyframes bump{50%{transform:scale(1.25)}}
.hud-beat{margin-top:8px;font-size:36px;font-weight:800;padding:4px 24px;border-radius:999px;background:rgba(255,61,242,.25);border:2px solid #ff3df2;display:inline-block}
.hud-beat.beaten{background:rgba(61,255,139,.3);border-color:#3dff8b}
/* avatar studio */
.avgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:1760px;margin:20px 0}
.avcard{width:190px;padding:10px 6px;border-radius:26px;border:4px solid #2de2ff;background:rgba(16,8,44,.85);color:#fff;display:flex;flex-direction:column;align-items:center;box-shadow:0 0 18px rgba(45,226,255,.5)}
.avcard:active{transform:scale(.95)}
.avcard .a{width:120px;height:144px}.avcard b{font-size:30px;line-height:1.1;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.studio{display:flex;gap:60px;align-items:center}

.op .a{width:96px;height:112px}
/* modal */
.wbt{width:1000px;height:430px;font-family:inherit;font-size:36px;font-weight:700;padding:16px 24px;border-radius:24px;border:3px solid #2de2ff;background:rgba(0,0,0,.4);color:#fff;outline:none;resize:none;user-select:text;-webkit-user-select:text;margin:16px 0 26px;line-height:1.3}

.mbox{background:#170a3d;border:4px solid #2de2ff;border-radius:44px;padding:50px 70px;text-align:center;box-shadow:0 0 60px rgba(45,226,255,.5);animation:pop .3s}
.mbox .h2{margin-bottom:36px}
</style>

<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <canvas id="game" class="layer" width="1920" height="1080"></canvas>
  <div id="hud" class="layer"></div>
  <div id="ui" class="layer"></div>
  <canvas id="fx" class="layer" width="1920" height="1080"></canvas>
  <div id="controls">
    <button class="cbtn" id="cPause" title="Pause">⏸</button>
    <button class="cbtn" id="cSkip" title="Skip">⏭</button>
    <button class="cbtn" id="cSound" title="Sound">🔊</button>
    <button class="cbtn" id="cUndo" title="Undo last result">↩</button>
    <button class="cbtn" id="cRestart" title="Restart">⟲</button>
  </div>
  <div id="toast"></div>
  <div id="modal" class="layer hidden"></div>
</div>
<script>
'use strict';
/* =========================================================
   STAR ACADEMY: CLUB TRYOUTS — core
   ========================================================= */
const W=1920,H=1080,TAU=Math.PI*2;
const FONT='"Baloo 2","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",sans-serif';
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const $=s=>document.querySelector(s);

const CLUBS=[
  {id:'music',name:'Music',emoji:'🎹',c:'#ff3df2',c2:'#8a2be2',act:'playing the piano',game:'music'},
  {id:'sports',name:'Sports',emoji:'⚾',c:'#3dff8b',c2:'#00a3a3',act:'playing baseball',game:'sports'},
  {id:'art',name:'Art',emoji:'🎨',c:'#ffb627',c2:'#ff4f5e',act:'painting',game:'art'},
  {id:'computer',name:'Computer',emoji:'💻',c:'#2de2ff',c2:'#3a5bff',act:'using computers',game:'computer'},
];
const CB=id=>CLUBS.find(c=>c.id===id);

/* ---------------- canvas helpers ---------------- */
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function starPath(c,x,y,r1,r2,n=5,rot=-Math.PI/2){c.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
function txt(c,s,x,y,size,color,o={}){
  c.font=`${o.w||800} ${size}px ${FONT}`;c.textAlign=o.align||'center';c.textBaseline=o.base||'middle';
  if(o.stroke){c.lineWidth=o.stroke;c.strokeStyle=o.sc||'rgba(0,0,0,.7)';c.lineJoin='round';c.strokeText(s,x,y);}
  if(o.glow){c.shadowColor=o.glow;c.shadowBlur=o.blur||20;}
  c.fillStyle=color;c.fillText(s,x,y);c.shadowBlur=0;
}
function mk(w,h,fn){const cv=document.createElement('canvas');cv.width=w;cv.height=h;fn(cv.getContext('2d'));return cv;}
function ell(c,x,y,rx,ry,col,rot=0){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,TAU);c.fill();}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);c.fill();}

/* =========================================================
   AUDIO
   ========================================================= */
const AU={ctx:null,master:null,music:null,sfx:null,on:true,nb:null,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended'&&!S.paused) this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=this.ctx=new AC();
    this.master=c.createGain(); this.master.gain.value=this.on?0.9:0;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    this.master.connect(comp); comp.connect(c.destination);
    this.music=c.createGain(); this.music.gain.value=0.32; this.music.connect(this.master);
    this.sfx=c.createGain(); this.sfx.gain.value=0.85; this.sfx.connect(this.master);
    const len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.nb=b;
    if(Seq.want){const w=Seq.want;Seq.want=null;Seq.play(w);}
  },
  toggle(){ this.on=!this.on; if(this.master) this.master.gain.setTargetAtTime(this.on?0.9:0,this.ctx.currentTime,0.05); }
};
const now=()=>AU.ctx?AU.ctx.currentTime:0;
function tone(f,dur,o={}){
  const c=AU.ctx; if(!c) return null;
  const t=o.when!=null?o.when:c.currentTime;
  const osc=c.createOscillator(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+(o.slideT||dur));
  if(o.detune) osc.detune.value=o.detune;
  const g=c.createGain(), v=o.vol!=null?o.vol:0.3, a=o.attack||0.005;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(v,0.0002),t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(o.dest||AU.sfx); osc.start(t); osc.stop(t+dur+0.05);
  return osc;
}
function noise(dur,o={}){
  const c=AU.ctx; if(!c) return;
  const t=o.when!=null?o.when:c.currentTime;
  const s=c.createBufferSource(); s.buffer=AU.nb; s.loop=true;
  const f=c.createBiquadFilter(); f.type=o.ft||'highpass'; f.frequency.setValueAtTime(o.f||1000,t); f.Q.value=o.q||0.7;
  if(o.fslide) f.frequency.exponentialRampToValueAtTime(o.fslide,t+dur);
  const g=c.createGain(), v=o.vol!=null?o.vol:0.2, a=o.attack||0.003;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(o.dest||AU.sfx); s.start(t,Math.random()); s.stop(t+dur+0.05);
}
const kick=(t,v=.5,d)=>tone(150,.28,{slide:42,vol:v,when:t,dest:d});
const hat=(t,v=.05,d)=>noise(.05,{f:7500,vol:v,when:t,dest:d});
const snare=(t,v=.18,d)=>{noise(.16,{ft:'bandpass',f:2200,q:.8,vol:v,when:t,dest:d});tone(210,.1,{type:'triangle',vol:v*.6,when:t,dest:d});};
const clap=(t,v=.16,d)=>{for(let i=0;i<3;i++)noise(.07,{ft:'bandpass',f:1600,q:1.2,vol:v,when:t+i*.012,dest:d});};

function piano(f,v=.35,dur=1.1,when){
  tone(f,dur,{type:'triangle',vol:v,when}); tone(f*2,dur*.5,{vol:v*.35,when}); tone(f*3,dur*.25,{vol:v*.12,when});
}
const sfx={
  tap(){tone(900,.07,{type:'triangle',vol:.12});},
  good(){tone(660,.14,{type:'triangle',vol:.25});tone(990,.2,{type:'triangle',vol:.25,when:now()+.08});},
  yes(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,{type:'square',vol:.08,when:now()+i*.07}));},
  bad(){tone(200,.35,{type:'sawtooth',vol:.12,slide:90});},
  miss(){tone(140,.12,{type:'square',vol:.07,slide:90});},
  pop(){tone(520,.12,{slide:180,vol:.4});noise(.05,{f:3000,vol:.15});},
  catchB(){tone(180,.12,{type:'square',vol:.15,slide:80});noise(.08,{ft:'lowpass',f:900,vol:.5});},
  whoosh(){noise(.45,{ft:'bandpass',f:400,fslide:3000,q:1.5,vol:.18,attack:.15});},
  splash(){noise(.7,{ft:'lowpass',f:3000,fslide:300,vol:.5});for(let i=0;i<6;i++)tone(rand(400,900),.08,{slide:rand(1200,1800),vol:.12,when:now()+i*.05});},
  zap(){tone(1600,.18,{type:'sawtooth',vol:.12,slide:120});noise(.15,{f:4000,vol:.18});tone(60,.15,{type:'square',vol:.1});},
  gold(){[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.25,{type:'triangle',vol:.18,when:now()+i*.06}));},
  deleted(){[392,370,349,262].forEach((f,i)=>tone(f,i===3?.7:.28,{type:'sawtooth',vol:.12,when:now()+i*.25,slide:i===3?200:undefined}));},
  alarm(){for(let i=0;i<4;i++)tone(i%2?660:880,.16,{type:'square',vol:.12,when:now()+i*.16});noise(.3,{ft:'bandpass',f:500,vol:.15});},
  chime(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,.5,{vol:.16,when:now()+i*.08}));},
  flip(){noise(.25,{ft:'bandpass',f:1200,fslide:4000,vol:.25});tone(500,.2,{type:'triangle',slide:1200,vol:.12});},
  tick(){tone(1400,.04,{type:'square',vol:.07});},
  count(){tone(660,.18,{type:'square',vol:.15});},
  go(){tone(1320,.45,{type:'square',vol:.15});tone(990,.45,{type:'triangle',vol:.15});},
  whistle(){tone(2200,.5,{type:'sine',vol:.2,detune:0});tone(2350,.5,{type:'sine',vol:.12});},
  fanfare(){const t=now();[[523,0],[659,.12],[784,.24],[1047,.36],[784,.56],[1047,.68]].forEach(([f,d],i)=>{tone(f,i===5?.9:.2,{type:'square',vol:.1,when:t+d});tone(f/2,i===5?.9:.2,{type:'triangle',vol:.15,when:t+d});});},
  boom(v=.5){noise(1.2,{ft:'lowpass',f:600,fslide:60,vol:v});tone(80,.6,{slide:30,vol:v*.6});setTimeout(()=>{for(let i=0;i<6;i++)noise(.05,{f:5000,vol:.05,when:now()+rand(0,.5)});},300);},
  drum(n=8){const t=now();for(let i=0;i<n;i++)snare(t+i*.06,.08);},
  cheer(v=.6){
    if(!AU.ctx)return; v=clamp(v,.15,1);
    noise(2.2,{ft:'bandpass',f:1500,q:.5,vol:.28*v,attack:.25});
    noise(2.0,{ft:'bandpass',f:700,q:.6,vol:.2*v,attack:.3});
    for(let i=0;i<Math.round(10*v);i++) noise(.06,{ft:'bandpass',f:1800,q:1,vol:.12*v,when:now()+rand(0,1.6)});
    for(let i=0;i<Math.round(4*v);i++){const t=now()+rand(0,1);tone(rand(900,1300),.5,{vol:.05*v,slide:rand(1600,2400),when:t,attack:.1});}
  },
};

/* ---------------- music sequencer ---------------- */
const Seq={want:null,tr:null,step:0,next:0,timer:null,rate:1,
  play(n){
    if(this.tr&&this.want===n) return;
    this.stop(); this.want=n; this.rate=1;
    if(!AU.ctx||!n) return;
    this.tr=TR[n]; this.step=0; this.next=AU.ctx.currentTime+.08;
    this.timer=setInterval(()=>this.tick(),25);
  },
  stop(){clearInterval(this.timer);this.timer=null;this.tr=null;this.want=null;},
  tick(){
    const c=AU.ctx,tr=this.tr; if(!tr) return;
    if(this.next<c.currentTime-.2) this.next=c.currentTime+.02;
    const spb=60/(tr.bpm*this.rate)/tr.div;
    while(this.next<c.currentTime+.12){ tr.fn(this.step,this.next,spb); this.step++; this.next+=spb; }
  }
};
const M=()=>AU.music;
const COURT_MEL=[72,0,76,0,79,77,76,0, 76,0,74,72,74,0,0,0, 72,0,69,0,72,74,76,0, 74,0,72,0,71,0,74,0];
const ODE_TOK=('E E F G G F E D C C D E E D D2 E E F G G F E D C C D E D C C2 D D E C D E F E C D E F E D C D G2 E E F G G F E D C C D E D C C2').split(' ');
const NOTE_MIDI={C:60,D:62,E:64,F:65,G:67};
const ODE8=(()=>{const a=[];ODE_TOK.forEach(tk=>{const n=NOTE_MIDI[tk[0]],l=tk[1]==='2'?4:2;a.push([n,l]);for(let i=1;i<l;i++)a.push(null);});return a;})();
const TR={
  court:{bpm:112,div:2,fn(s,t,d){
    const bar=Math.floor(s/8)%4,i=s%8,ch=[[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]][bar];
    if(i===0||i===3||i===6) tone(mtof(ch[0]-24),d*1.5,{type:'triangle',vol:.4,when:t,dest:M()});
    tone(mtof(ch[[0,1,2,3,2,1,2,1][i]]),d*.8,{type:'square',vol:.035,when:t,dest:M()});
    const m=COURT_MEL[s%32]; if(m) tone(mtof(m),d*1.7,{type:'triangle',vol:.17,when:t,dest:M()});
    if(i%2) hat(t,.03,M()); if(i===0||i===4) kick(t,.35,M()); if(i===2||i===6) clap(t,.06,M());
  }},
  drive:{bpm:136,div:2,fn(s,t,d){
    const i=s%16, bass=[40,40,52,40,40,52,40,52,43,43,55,43,45,45,57,47][i];
    if(i%4===0) kick(t,.5,M()); if(i%8===4) snare(t,.14,M()); hat(t,i%2?.025:.045,M());
    tone(mtof(bass),d*.9,{type:'sawtooth',vol:.07,when:t,dest:M()});
    tone(mtof(bass-12),d*.9,{type:'triangle',vol:.25,when:t,dest:M()});
    if(i===0||i===6||i===12){const st=[64,67,71];st.forEach(n=>tone(mtof(n+(i===12?2:0)),d*.7,{type:'square',vol:.025,when:t,dest:M()}));}
  }},
  sneak:{bpm:104,div:2,fn(s,t,d){
    const i=s%16, b=[45,0,48,0,50,0,51,52,45,0,48,0,50,0,51,48][i];
    if(b){tone(mtof(b),d*.5,{type:'triangle',vol:.35,when:t,dest:M()});tone(mtof(b+12),d*.3,{type:'square',vol:.03,when:t,dest:M()});}
    if(i%4===2) hat(t,.04,M()); if(i===0||i===8) kick(t,.25,M());
    const hi=[0,0,0,0,76,0,75,0,0,0,0,0,72,0,71,0][i]; if(hi&&Math.floor(s/16)%2) tone(mtof(hi),d*.6,{type:'sine',vol:.08,when:t,dest:M()});
  }},
  fest:{bpm:118,div:2,fn(s,t,d){
    const i=s%16;
    if(i===0||i===2||i===8||i===10) kick(t,.55,M()); if(i===4||i===12) clap(t,.2,M());
    if(i%2) hat(t,.03,M());
    const ch=[[48,60,64,67],[53,57,60,65],[55,59,62,67],[48,60,64,67]][Math.floor(s/16)%4];
    if(i%4===0) tone(mtof(ch[0]),d*3,{type:'triangle',vol:.3,when:t,dest:M()});
    if(i%4===2) ch.slice(1).forEach(n=>tone(mtof(n+12),d*.6,{type:'square',vol:.025,when:t,dest:M()}));
  }},
  ending:{bpm:150,div:2,fn(s,t,d){
    const i=s%ODE8.length, e=ODE8[i];
    if(e){tone(mtof(e[0]+12),d*e[1]*.95,{type:'triangle',vol:.22,when:t,dest:M()});tone(mtof(e[0]),d*e[1]*.9,{type:'square',vol:.035,when:t,dest:M()});}
    const bar=Math.floor(i/8);
    if(i%4===0){const root=[48,43][bar%2];tone(mtof(root),d*3.5,{type:'triangle',vol:.3,when:t,dest:M()});}
    if(i%4===0) kick(t,.45,M()); if(i%8===4) snare(t,.14,M()); if(i%2) hat(t,.03,M());
  }},
};

/* =========================================================
   STATE, SCALING, LAYERS
   ========================================================= */

  rain(n=120,colors){colors=colors||['#ff3df2','#2de2ff','#ffe14d','#3dff8b'];for(let i=0;i<n;i++)this.p.push({x:rand(0,W),y:rand(-600,-20),vx:rand(-60,60),vy:rand(150,400),g:120,w:rand(14,24),h:rand(8,12),r:rand(0,6),vr:rand(-8,8),col:pick(colors),life:5,t:0,drag:1});},
  burst(x,y,n=40,colors){colors=colors||['#ffe14d','#fff','#ff3df2'];for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(200,900);this.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:600,w:rand(10,18),h:rand(10,18),r:0,vr:rand(-8,8),col:pick(colors),life:rand(.8,1.4),t:0,drag:.96,star:true});}},
  update(dt){for(const q of this.p){q.t+=dt;q.vx*=q.drag;q.vy=q.vy*q.drag+q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;}this.p=this.p.filter(q=>q.t<q.life&&q.y<H+100);},

    if(!this.p.length){if(this.had){fxc.clearRect(0,0,W,H);this.had=false;}return;}
    this.had=true;fxc.clearRect(0,0,W,H);
    for(const q of this.p){fxc.save();fxc.globalAlpha=clamp((q.life-q.t)/.6,0,1);fxc.translate(q.x,q.y);fxc.rotate(q.r);fxc.fillStyle=q.col;

let scene=null;

function loop(t){
  const dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  if(!S.paused){ if(scene) scene.update(dt); FX.update(dt); }
  if(scene) scene.draw(gctx);
  FX.draw();
  requestAnimationFrame(loop);
}

/* =========================================================
   GAME RUNNER (15-second tryouts)
   ========================================================= */
const GAME_TIME=15;
const Run={
  start(id,opts){
    this.id=id;this.def=GAMES[id];this.opts=opts;this.score=0;this.elapsed=0;this.state='count';this.countT=3.2;this.lastCount=4;
    this.pops=[];this.shake=0;this.flashA=0;this.flashC='#fff';this.beaten=false;this.overT=0;this.banner=null;
    this.g=this.def.create(this);
    ui.innerHTML='';cur={acts:{},skip:()=>this.skip()};
    showCanvas(true);this.buildHUD();scene=this;Seq.stop();
  },
  get speed(){return 1+this.elapsed/GAME_TIME*0.6;},
  buildHUD(){
    const o=this.opts,st=o.student,cl=o.club;
    hud.style.display='block';
    hud.innerHTML=`<div class="hud-tl" style="--c:${cl.c}"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/><circle id="hRing" cx="60" cy="60" r="50" fill="none" stroke="${cl.c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="314.2" stroke-dashoffset="0"/></svg><b id="hTime">15</b></div>
      <div class="hav">${avatarSVG(st)}</div><div><div class="hn">${esc(st.name)}</div><div class="hl">${esc(o.label)}</div></div></div>
      <div class="hud-score"><div class="lbl">SCORE</div><div class="val" id="hScore">0</div>${o.beat!=null?`<div class="hud-beat" id="hBeat">🎯 Score to beat: <b>${o.beat}</b></div>`:''}</div>`;
    this.hTime=$('#hTime');this.hRing=$('#hRing');this.hScore=$('#hScore');this.lastSec=-1;
  },
  hideHUD(){hud.style.display='none';hud.innerHTML='';},
  add(n,x,y,label,color){
    this.score=Math.max(0,this.score+n);
    this.hScore.textContent=this.score;this.hScore.classList.remove('bump');void this.hScore.offsetWidth;this.hScore.classList.add('bump');
    if(label) this.pop(x,y,label,color||(n>=0?'#ffe14d':'#ff5470'),n>=3||n<0?78:64);
    const b=this.opts.beat;
    if(b!=null&&!this.beaten&&this.score>b){this.beaten=true;const hb=$('#hBeat');if(hb){hb.classList.add('beaten');hb.innerHTML='🔥 NEW HIGH SCORE! 🔥';}this.pop(960,330,'NEW HIGH SCORE! 🔥','#3dff8b',90);sfx.yes();}
  },
  pop(x,y,text,color='#fff',size=64){this.pops.push({x,y,text,color,size,t:0});},
  flash(col,a=.5){this.flashC=col;this.flashA=a;},
  skip(){
    if(this.state==='count'){this.state='play';this.countT=0;Seq.play(this.def.track);return;}
    if(this.state==='play'){this.end();return;}
    if(this.state==='over'){this.finish();}
  },
  update(dt){
    if(this.state==='count'){
      this.countT-=dt;const n=Math.ceil(this.countT-.2);
      if(n!==this.lastCount&&n>=1&&n<=3){this.lastCount=n;sfx.count();}
      if(this.countT<=0){this.state='play';sfx.go();if(this.def.track)Seq.play(this.def.track);}
      if(this.g.idle) this.g.idle(dt,this);
    } else if(this.state==='play'){
      this.elapsed+=dt;Seq.rate=1+this.elapsed/GAME_TIME*.18;
      this.g.update(dt,this);
      if(this.elapsed>=GAME_TIME){this.elapsed=GAME_TIME;this.end();}
      const left=Math.max(0,GAME_TIME-this.elapsed),sec=Math.ceil(left);
      if(sec!==this.lastSec){this.lastSec=sec;this.hTime.textContent=sec;if(sec<=3&&sec>0)sfx.tick();}
      this.hRing.style.strokeDashoffset=314.2*(1-left/GAME_TIME);
    } else if(this.state==='over'){
      this.overT-=dt;if(this.g.idle)this.g.idle(dt,this);
      if(this.overT<=0) this.finish();
    }
    for(const p of this.pops)p.t+=dt;this.pops=this.pops.filter(p=>p.t<1.1);
    this.shake=Math.max(0,this.shake-dt*30);this.flashA=Math.max(0,this.flashA-dt*1.6);
  },
  end(){
    if(this.state==='over')return;
    this.state='over';this.overT=2.4;Seq.stop();this.hTime.textContent='0';this.hRing.style.strokeDashoffset=314.2;
    if(this.g.end)this.g.end(this);
    this.banner={text:this.def.endText||'TIME UP!',t:0};
    sfx.whistle();setTimeout(()=>sfx.cheer(.5),300);
  },
  finish(){
    if(scene!==this)return;
    scene=null;showCanvas(false);this.hideHUD();
    const sc=this.score;this.opts.onEnd(sc);
  },
  down(p){if(this.state==='play'&&this.g.down)this.g.down(p,this);},
  move(p){if(this.state==='play'&&this.g.move)this.g.move(p,this);},
  up(p){if(this.g.up)this.g.up(p,this);},
  key(k,d){if(this.state==='play'&&this.g.key)this.g.key(k,d,this);},
  draw(c){
    c.save();
    if(this.shake>0)c.translate(rand(-this.shake,this.shake),rand(-this.shake,this.shake));
    this.g.draw(c,this);
    for(const p of this.pops){const k=p.t/1.1,s=k<.15?k/.15:1;c.globalAlpha=1-Math.max(0,(k-.6)/.4);
      txt(c,p.text,p.x,p.y-k*90,p.size*(0.6+0.4*s),p.color,{stroke:10,glow:p.color,blur:16});}
    c.globalAlpha=1;
    if(this.flashA>0){c.fillStyle=this.flashC;c.globalAlpha=this.flashA;c.fillRect(-50,-50,W+100,H+100);c.globalAlpha=1;}
    c.restore();
    if(this.state==='count'){
      c.fillStyle='rgba(5,2,20,.55)';c.fillRect(0,0,W,H);
      const n=Math.ceil(this.countT-.2),fr=(this.countT-.2)%1;
      const label=n>=1?String(n):'GO!';const s=n>=1?1+fr*.5:1.2;
      txt(c,this.def.title,960,300,70,'#fff',{stroke:10,glow:this.opts.club.c,blur:30});
      c.save();c.translate(960,580);c.scale(s,s);txt(c,label,0,0,300,n>=1?'#ffe14d':'#3dff8b',{stroke:18,glow:'#ff9d00',blur:40});c.restore();
    }
    if(this.banner){this.banner.t+=1/60;const k=Math.min(1,this.banner.t*3);
      c.fillStyle=`rgba(5,2,20,${.5*k})`;c.fillRect(0,0,W,H);
      c.save();c.translate(960,540);const s=k<1?.4+.8*k-.2*Math.sin(k*Math.PI):1;c.scale(s,s);c.rotate(-.04);
      txt(c,this.banner.text,0,0,170,'#fff',{stroke:20,glow:this.opts.club.c,blur:50});c.restore();}
  }
};

function drawGrandPiano(c,x,y,s,col='#0b0610',hi='rgba(255,255,255,.25)'){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle=col;
  c.beginPath();c.moveTo(0,0);c.lineTo(300,0);c.bezierCurveTo(300,-60,250,-60,230,-80);c.bezierCurveTo(200,-110,150,-110,120,-90);c.lineTo(0,-90);c.closePath();c.fill();
  c.beginPath();c.moveTo(10,-90);c.lineTo(250,-230);c.lineTo(262,-218);c.lineTo(60,-88);c.closePath();c.fill();
  c.fillRect(0,0,300,36);
  c.fillStyle='#f4f0e6';c.fillRect(6,4,140,20);c.fillStyle=col;for(let i=0;i<12;i++)if(i%7!==2&&i%7!==6)c.fillRect(14+i*11,4,6,12);
  c.fillStyle=col;c.fillRect(20,36,16,110);c.fillRect(260,36,16,110);c.fillRect(140,36,14,96);
  c.strokeStyle=hi;c.lineWidth=3;c.beginPath();c.moveTo(10,-90);c.lineTo(250,-230);c.stroke();
  c.restore();
}

  }
  drawBug(c,o,s){
    c.save();c.translate(o.x,o.y);c.scale(s,s);c.rotate(Math.sin(this.t*10)*.15);
    c.save();c.globalCompositeOperation='lighter';circ(c,0,0,110,'rgba(255,215,0,.22)');c.restore();
    c.strokeStyle='#8a6000';c.lineWidth=7;for(let i=-1;i<=1;i++)for(const sx of [-1,1]){c.beginPath();c.moveTo(sx*30,i*24);c.lineTo(sx*66,i*30+Math.sin(this.t*20+i)*8);c.stroke();}
    const g=c.createRadialGradient(-15,-20,5,0,0,60);g.addColorStop(0,'#fff6b0');g.addColorStop(.5,'#ffd400');g.addColorStop(1,'#c08a00');
    c.fillStyle=g;c.beginPath();c.ellipse(0,8,46,56,0,0,TAU);c.fill();c.strokeStyle='#8a6000';c.lineWidth=4;c.beginPath();c.moveTo(0,-40);c.lineTo(0,62);c.stroke();
    circ(c,0,-50,26,'#c08a00');circ(c,-10,-54,7,'#fff');circ(c,10,-54,7,'#fff');circ(c,-10,-54,3.5,'#111');circ(c,10,-54,3.5,'#111');
    c.fillStyle='#fff';starPath(c,22,20,12,4,4,this.t*4);c.fill();starPath(c,-24,-4,8,3,4,-this.t*4);c.fill();

  }
  drawTrap(c,o,s){
    c.save();c.translate(o.x,o.y);c.scale(s,s);c.rotate(Math.sin(this.t*4+o.ph)*.05);
    c.shadowColor='rgba(255,255,255,.6)';c.shadowBlur=20;

    else{c.fillStyle='#fff';c.beginPath();c.moveTo(-46,-60);c.lineTo(22,-60);c.lineTo(46,-36);c.lineTo(46,60);c.lineTo(-46,60);c.closePath();c.fill();c.shadowBlur=0;
      c.fillStyle='#d0d6e8';c.beginPath();c.moveTo(22,-60);c.lineTo(22,-36);c.lineTo(46,-36);c.closePath();c.fill();
      if(o.icon==='doc'){c.fillStyle='#3a6cff';rr(c,-34,-44,40,16,4);c.fill();c.fillStyle='#9aa8d0';for(let i=0;i<5;i++)c.fillRect(-34,-16+i*14,68-(i%2)*18,6);}

    c.restore();
    c.font=`800 30px ${FONT}`;const w=c.measureText(o.label).width+30;c.fillStyle='rgba(20,30,90,.9)';rr(c,o.x-w/2,o.y+68*s,w,42,12);c.fill();txt(c,o.label,o.x,o.y+68*s+22,30,'#fff');
  }
  draw(c,R){
    c.drawImage(this.bg,0,0);
    for(const o of this.objs){
      let s=1,a=1;if(o.st==='live'){s=o.t<.18?o.t/.18*1.15:1;}else if(o.st==='leave'){s=1-o.t2/.3;}else{s=1+o.t2*2;a=1-o.t2/.3;}
      if(o.type!=='trap'){const ws=Math.min(1,o.t*6)*(o.st==='live'?1:Math.max(0,1-o.t2*4));

          c.fillStyle=o.type==='gold'?'#ffe14d':'#ff5470';rr(c,o.x-110,o.y-110,220,36,16);c.fill();txt(c,o.type==='gold'?'★ BUG.exe':'⚠ ERROR',o.x-96,o.y-91,22,'#14062e',{align:'left'});txt(c,'✕',o.x+92,o.y-91,22,'#14062e');c.restore();}}
      c.globalAlpha=a;

    for(const z of this.zaps){const a=1-z.t/.45;c.strokeStyle=z.gold?`rgba(255,230,80,${a})`:`rgba(120,240,255,${a})`;c.lineWidth=8;c.shadowColor=c.strokeStyle;c.shadowBlur=30;
      for(const seg of z.segs){c.beginPath();seg.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
      c.lineWidth=6;c.beginPath();c.arc(z.x,z.y,40+z.t*400,0,TAU);c.stroke();circ(c,z.x,z.y,60*a,`rgba(255,255,255,${a})`);}
    c.restore();
    if(this.glitch>0){for(let i=0;i<8;i++){const y=rand(0,H),h=rand(10,60);c.drawImage(gcv,0,y,W,h,rand(-60,60),y,W,h);}
      c.fillStyle=`rgba(255,0,60,${this.glitch*.25})`;c.fillRect(0,0,W,H);
      txt(c,'⚠ FILE DELETED! 😱',960,560,110,'#fff',{stroke:14,glow:'#ff0033',blur:30});}
    c.drawImage(this.scan,0,0);

}

  screen(`<div class="h3">${c.emoji} ${c.name} club champion</div><div class="row" style="gap:70px"><div style="width:280px;height:336px">${avatarSVG(st)}</div>
     <div class="col" style="gap:0"><div class="h2">${esc(st.name)}</div><div class="bigscore" id="bs">0</div><div class="h2 neon" style="--c:${c.c}">${comment(G,sc)}</div></div></div>
     <div style="margin-top:40px"><button class="btn ${last?'gold pulse':'cyan'} big" data-act="n">${last?'🏆 Who is the CHAMPION CLUB?':`Next: ${ch.parts[k+1].name} club ▶`}</button></div>`,
    {bg:'club',club:c,acts:{n:()=>champReady(k+1)},skip:()=>champReady(k+1)});
  countUp($('#bs'),sc);
}
function champResult(){
  const ch=S.champ;const sorted=ch.parts.slice().sort((a,b)=>ch.scores[b.id]-ch.scores[a.id]);
  const top=ch.scores[sorted[0].id],tied=sorted.filter(c=>ch.scores[c.id]===top);
  if(tied.length>1){tieScreen(tied.map(c=>ch.champs[c.id]),tied[0],s=>ending(CB(s.club)));return;}
  sfx.drum(16);
  screen(`<p class="h1 neon" style="--c:#ffe14d;margin-bottom:30px">🏆 FINAL SCORES 🏆</p>
    <div class="board">${sorted.map((c,i)=>{const s=ch.champs[c.id];return `<div class="br ${i===0?'top':''}" style="--c:${c.c};animation:pop .5s ${(sorted.length-i)*.4}s both"><span style="font-size:60px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'🎖️'}</span><div class="bav">${avatarSVG(s)}</div><span>${c.emoji} ${c.name} club · ${esc(s.name)}</span><span class="bs">${ch.scores[c.id]}</span></div>`;}).join('')}</div>
    <div style="margin-top:40px"><button class="btn gold big pulse" data-act="go">🎆 Open the School Festival!</button></div>`,
    {bg:'grid',acts:{go:()=>ending(sorted[0])},skip:()=>ending(sorted[0])});
}

/* =========================================================
   ENDING — the champion club opens the School Festival
   ========================================================= */
class Ending{
  constructor(club){this.c=club;this.t=0;this.rk=[];this.sp=[];this.nextR=.2;this.notes=[];this.code=[];
    for(let i=0;i<60;i++)this.code.push({x:i*32+rand(-5,5),y:rand(-H,0),v:rand(150,400)});
    this.hr={t:0};this.bg=mk(W,H,c=>{const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03021a');g.addColorStop(.7,'#1a0a4a');g.addColorStop(1,'#2a0e5a');c.fillStyle=g;c.fillRect(0,0,W,H);
      for(let i=0;i<150;i++)circ(c,rand(0,W),rand(0,700),rand(.8,2.4),`rgba(255,255,255,${rand(.3,1)})`);
      c.fillStyle='#0c0628';c.beginPath();c.moveTo(0,H);c.lineTo(0,900);for(let x=0;x<=W;x+=120)c.lineTo(x,880-((x/120)%3)*40-(Math.abs(x-960)<300?80:0));c.lineTo(W,H);c.fill();
      for(let i=0;i<60;i++){c.fillStyle=Math.random()<.6?'rgba(255,216,107,.7)':'rgba(255,255,255,.15)';c.fillRect(rand(0,W),rand(860,1060),14,18);}});}
  launch(x,y){const tx=x??rand(200,W-200),ty=y??rand(120,450);this.rk.push({x:tx,y:H,ty,vy:-rand(1100,1400),col:pick([this.c.c,this.c.c2,'#ffe14d','#fff','#2de2ff','#ff3df2'])});}
  explode(x,y,col){const n=70;for(let i=0;i<n;i++){const a=i/n*TAU,s=rand(250,480);this.sp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col:Math.random()<.2?'#fff':col,t:0,life:rand(1.2,1.8)});}sfx.boom(.35);}
  update(dt){
    this.t+=dt;this.nextR-=dt;if(this.nextR<=0){this.launch();this.nextR=rand(.25,.6);}
    for(const r of this.rk){r.y+=r.vy*dt;r.vy+=500*dt;if(r.y<=r.ty||r.vy>-100){r.done=true;this.explode(r.x,r.y,r.col);}}this.rk=this.rk.filter(r=>!r.done);
    for(const s of this.sp){s.t+=dt;s.vx*=.985;s.vy=s.vy*.985+180*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;}this.sp=this.sp.filter(s=>s.t<s.life);
    if(this.c.id==='music'&&Math.random()<dt*6)this.notes.push({x:rand(150,700),y:820,vx:rand(-30,30),t:0,s:pick(['♪','♫','♬']),col:pick(['#ff3df2','#ffe14d','#2de2ff'])});
    for(const n of this.notes){n.t+=dt;n.y-=140*dt;n.x+=n.vx*dt+Math.sin(n.t*3)*1.5;}this.notes=this.notes.filter(n=>n.t<5);
    if(this.c.id==='sports'){this.hr.t+=dt;if(this.hr.t>4){this.hr.t=0;}if(Math.abs(this.hr.t-.35)<dt){sfx.catchB();sfx.cheer(1);}}
    for(const d of this.code){d.y+=d.v*dt;if(d.y>H)d.y=rand(-400,0);}
  }
  down(p){this.launch(p.x,Math.min(p.y,600));}
  drawTrophy(c,x,y,s){
    c.save();c.translate(x,y);c.scale(s,s);
    c.save();c.globalCompositeOperation='lighter';const rg=c.createRadialGradient(0,-60,20,0,-60,380);rg.addColorStop(0,'rgba(255,220,80,.5)');rg.addColorStop(1,'rgba(255,220,80,0)');c.fillStyle=rg;c.fillRect(-400,-440,800,800);
    for(let i=0;i<12;i++){c.rotate(TAU/12+this.t*.02);c.fillStyle='rgba(255,230,120,.07)';c.beginPath();c.moveTo(0,-60);c.lineTo(-40,-600);c.lineTo(40,-600);c.fill();}c.restore();
    const g=c.createLinearGradient(-160,0,160,0);g.addColorStop(0,'#a87000');g.addColorStop(.3,'#ffe680');g.addColorStop(.5,'#fff6c0');g.addColorStop(.7,'#ffd23a');g.addColorStop(1,'#a87000');
    c.strokeStyle=g;c.lineWidth=30;c.beginPath();c.arc(-150,-150,60,Math.PI*.5,Math.PI*1.5);c.stroke();c.beginPath();c.arc(150,-150,60,-Math.PI*.5,Math.PI*.5);c.stroke();
    c.fillStyle=g;c.beginPath();c.moveTo(-170,-230);c.lineTo(170,-230);c.quadraticCurveTo(170,20,30,50);c.lineTo(-30,50);c.quadraticCurveTo(-170,20,-170,-230);c.fill();
    c.fillRect(-26,40,52,80);rr(c,-110,110,220,40,12);c.fill();
    c.fillStyle='#3a1f6a';rr(c,-170,150,340,100,16);c.fill();c.strokeStyle=g;c.lineWidth=8;rr(c,-170,150,340,100,16);c.stroke();
    txt(c,this.c.name.toUpperCase()+' CLUB',0,186,this.c.name.length>6?40:48,'#ffe14d');txt(c,'CHAMPION',0,226,30,'#fff');
    ell(c,-80,-170,18,50,'rgba(255,255,255,.55)');
    c.fillStyle='#fff';starPath(c,0,-130,60,26);c.fill();txt(c,this.c.emoji,0,-128,56,'#000');
    c.restore();
  }
  draw(c){
    c.drawImage(this.bg,0,0);
    const id=this.c.id;
    if(id==='computer'){c.font=`700 28px monospace`;c.textAlign='center';for(const d of this.code){for(let k=0;k<8;k++){c.fillStyle=`rgba(61,255,139,${(1-k/8)*.5})`;c.fillText(Math.random()<.5?'1':'0',d.x,d.y-k*30);}}}
    c.save();c.globalCompositeOperation='lighter';
    for(const s of this.sp){const a=1-s.t/s.life;circ(c,s.x,s.y,4*a+1.5,s.col);c.globalAlpha=a*.4;circ(c,s.x,s.y,10*a,s.col);c.globalAlpha=1;}
    for(const r of this.rk){circ(c,r.x,r.y,5,'#fff');c.fillStyle='rgba(255,200,120,.4)';c.fillRect(r.x-2,r.y,4,60);}
    c.restore();
    // themed show
    if(id==='music'){
      c.save();c.globalCompositeOperation='lighter';const gr=c.createLinearGradient(400,0,400,900);gr.addColorStop(0,'rgba(255,61,242,.35)');gr.addColorStop(1,'rgba(255,61,242,0)');c.fillStyle=gr;c.beginPath();c.moveTo(380,0);c.lineTo(440,0);c.lineTo(700,900);c.lineTo(120,900);c.fill();c.restore();
      drawGrandPiano(c,220,900,1.3,'#150a2a','rgba(255,61,242,.8)');
      for(const n of this.notes){c.globalAlpha=Math.min(1,(5-n.t)/1.5);txt(c,n.s,n.x,n.y,70,n.col,{glow:n.col});}c.globalAlpha=1;
      drawGrandPiano(c,1500,900,1.3,'#150a2a','rgba(45,226,255,.8)');
      txt(c,'🎹 PIANO CONCERT 🎹',960,1010,60,'#fff',{glow:this.c.c,blur:30,stroke:8});
    } else if(id==='sports'){
      const k=this.hr.t;
      c.save();c.translate(320,880);c.strokeStyle='#e8ecff';c.lineWidth=16;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.lineTo(0,-90);c.stroke();circ(c,0,-120,28,'#e0ac69');
      c.fillStyle='#2a3bff';c.beginPath();c.arc(0,-126,30,Math.PI,0);c.fill();const sw=k<.35?lerp(-2.2,.6,k/.35):.6;c.rotate(sw);c.fillStyle='#c98a4a';rr(c,-6,-60,140,18,9);c.fill();c.restore();
      if(k>.35&&k<3){const p=(k-.35)/2.2,bx=lerp(420,1900,p),by=860-Math.sin(p*Math.PI*.9)*820;
        c.save();c.globalCompositeOperation='lighter';for(let i=0;i<14;i++){const q=Math.max(0,p-i*.012),tx=lerp(420,1900,q),ty=860-Math.sin(q*Math.PI*.9)*820;circ(c,tx,ty,26-i*1.5,`rgba(255,${150+i*6},40,${.35-i*.02})`);}c.restore();
        circ(c,bx,by,28,'#fff');}
      if(k>.6&&k<3.6){const s=Math.min(1,(k-.6)*4);c.save();c.translate(1450,300);c.scale(s,s);c.rotate(-.08);txt(c,'HOME RUN!',0,0,150,'#ffe14d',{stroke:16,glow:'#ff7a3d',blur:40});c.restore();}
      txt(c,'⚾ STADIUM NIGHT ⚾',960,1010,60,'#fff',{glow:this.c.c,blur:30,stroke:8});
    } else if(id==='art'){
      const fr=[[110,330],[400,560],[1280,560],[1570,330]];
      PAINTINGS.forEach((p,i)=>{const [x,y]=fr[i],w=240,h=280,gl=.5+.5*Math.sin(this.t*3+i);
        c.save();c.shadowColor=['#ff3df2','#ffe14d','#2de2ff','#3dff8b'][i];c.shadowBlur=40+gl*50;c.fillStyle='#000';c.fillRect(x,y,w,h);c.restore();
        drawPaintingBg(c,p.type,x,y,w,h);drawAnimal(c,p.type,x+w/2,y+h/2+30,1.55,this.t);drawGoldFrame(c,x,y,w,h,['#ff3df2','#ffe14d','#2de2ff','#3dff8b'][i]);
        c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.15*gl;c.fillStyle='#fff';c.fillRect(x,y,w,h);c.restore();});
      txt(c,'🎨 GLOWING GALLERY 🎨',960,1010,60,'#fff',{glow:this.c.c,blur:30,stroke:8});
    } else {
      for(const mx of [330,1590]){c.fillStyle='#1b2a5a';rr(c,mx-220,520,440,300,24);c.fill();c.strokeStyle='#2de2ff';c.lineWidth=8;c.shadowColor='#2de2ff';c.shadowBlur=30;rr(c,mx-220,520,440,300,24);c.stroke();c.shadowBlur=0;
        c.fillStyle='#0a1a12';rr(c,mx-196,544,392,252,12);c.fill();c.fillStyle='#1b2a5a';c.fillRect(mx-30,820,60,50);rr(c,mx-110,866,220,22,10);c.fill();
        txt(c,'✅',mx,620,90,'#3dff8b');txt(c,'SYSTEM SAVED!',mx,730,46,'#3dff8b',{glow:'#3dff8b'});}
      txt(c,'💻 SYSTEM SAVED! 💻',960,1010,60,'#fff',{glow:this.c.c,blur:30,stroke:8});
    }
    const k=clamp((this.t-1.2)/1.4,0,1),e=1-Math.pow(1-k,3);
    this.drawTrophy(c,960,lerp(1500,590,e),.95+Math.sin(this.t*2)*.02);
  }
}
function ending(club){
  S.champ.winner=club;
  screen(`<div class="endtop"><p class="h1 neon" style="--c:${club.c};font-size:96px">🏆 CHAMPION CLUB 🏆</p><p class="h2" style="margin-top:8px">The <span style="color:${club.c};text-shadow:0 0 20px ${club.c}">${club.name} club</span> opens the School Festival! 🎉</p></div>
    <div style="position:absolute;right:30px;bottom:110px"><button class="btn gray" data-act="again" style="font-size:36px;padding:12px 36px">⟲ Play again</button></div>`,
    {cls:'',bg:'',acts:{again:()=>confirmBox('Start a new game?',()=>{S.paused=false;setupScreen();})},skip:null});
  ui.firstElementChild.style.pointerEvents='none';ui.querySelector('[data-act="again"]').style.pointerEvents='auto';
  scene=new Ending(club);showCanvas(true);Seq.play('ending');sfx.fanfare();setTimeout(()=>sfx.cheer(1),500);FX.confetti(220,[club.c,club.c2,'#ffe14d','#fff']);
}

/* =========================================================
   TEACHER CONTROLS
   ========================================================= */
function setPause(on){
  S.paused=on;$('#cPause').textContent=on?'▶':'⏸';
  if(AU.ctx){on?AU.ctx.suspend():AU.ctx.resume();}
  if(on)modal(`<p class="h1 neon" style="--c:#2de2ff;margin-bottom:30px">⏸ PAUSED</p><button class="btn green big" data-act="r">▶ Resume</button>`,{r:()=>{closeModal();setPause(false);}});
  else closeModal();
}
const ctl=(id,fn)=>$(id).addEventListener('click',e=>{e.stopPropagation();AU.init();fn();});
ctl('#cPause',()=>setPause(!S.paused));
ctl('#cSkip',()=>{if(S.paused)setPause(false);if(!$('#modal').classList.contains('hidden'))return;if(cur.skip){sfx.tap();cur.skip();}else toast('Nothing to skip here');});
ctl('#cSound',()=>{AU.toggle();$('#cSound').textContent=AU.on?'🔊':'🔇';$('#cSound').classList.toggle('off',!AU.on);});
ctl('#cUndo',()=>{
  if(!S.history.length){toast('Nothing to undo');return;}
  confirmBox('↩ Undo the last result?',()=>{
    if(S.paused)setPause(false);
    const h=S.history.pop();S.pair=h.pair;S.students.forEach((s,i)=>s.club=h.clubs[i]);S.champ=null;
    scene=null;Seq.stop();toast(`↩ Back to Pair ${S.pair+1}`);courtyard([]);
  });
});
ctl('#cRestart',()=>confirmBox('⟲ Restart the whole game?',()=>{if(S.paused)setPause(false);scene=null;S.flow=null;setupScreen();}));

window.SA={S,Run,GAMES,courtyard,startTournament,ending,champStart,CB};
setupScreen();
</script>
