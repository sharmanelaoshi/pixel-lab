:root{
  --wine:#7a1f2b; --wine2:#9c2236; --wineD:#4f0f19; --gold:#e3b448; --goldL:#ffe08a; --goldD:#a8761c;
  --cream:#fff8ea; --cream2:#f6ead0; --ink:#3a1a1f; --good:#2f8a4a; --bad:#c0392b;
  --emoji:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,#4b2c74 0%,#8a3e8c 24%,#d9558a 48%,#ff7f6b 70%,#ffb38a 86%,#ffd3a0 100%);}
body{font-family:'Playpen Sans',var(--emoji);color:var(--ink)}
button{font-family:inherit;color:inherit}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:linear-gradient(180deg,#4b2c74 0%,#8a3e8c 24%,#d9558a 48%,#ff7f6b 70%,#ffb38a 86%,#ffd3a0 100%);}
.hidden{display:none!important}
svg text{font-family:'Playpen Sans',var(--emoji)}
.emo{font-family:var(--emoji)}

/* sky */
#stars{position:absolute;left:0;top:0;width:1920px;height:400px;pointer-events:none}
#skyline{position:absolute;left:0;bottom:0;width:1920px;height:380px;pointer-events:none}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
.flame{animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.85,1.12) rotate(3deg)}}
.candleGlow,.lampGlow,.chGlow{animation:glowp 2.4s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.95}50%{opacity:.6}}
.beacon{animation:twinkle 1.2s infinite}

/* top bar */
#topbar{position:absolute;left:0;top:0;width:1920px;height:110px;display:flex;align-items:center;gap:18px;padding:0 20px;
  background:linear-gradient(180deg,rgba(60,14,30,.88),rgba(60,14,30,.55));border-bottom:4px solid var(--gold);z-index:20}
#sign{height:84px;min-width:430px;padding:0 26px;border-radius:18px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,#8e2635,#5e1520);border:4px solid var(--gold);box-shadow:inset 0 0 0 3px #5e1520,inset 0 0 0 5px var(--goldL),0 6px 14px rgba(0,0,0,.35)}
#sign .nm{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:48px;color:var(--goldL);
  text-shadow:0 2px 0 #5e1520,0 0 14px rgba(255,210,120,.55);white-space:nowrap}
#sign svg{flex:none}
#pills{flex:1;display:flex;gap:8px;justify-content:center}
.pill{height:58px;padding:0 14px;border-radius:29px;display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;
  background:rgba(255,248,234,.16);color:#fbe9d0;border:3px solid rgba(255,224,138,.35);white-space:nowrap;transition:all .3s}
.pill .n{font-size:16px;opacity:.75}
.pill.cur{background:linear-gradient(180deg,#fff1b3,#e3b448);color:#5e1520;border-color:#fff6d0;transform:scale(1.1);box-shadow:0 0 18px rgba(255,214,120,.8)}
.pill.done{background:rgba(47,138,74,.45);border-color:#9be0a8}
.pill.off{opacity:.35;text-decoration:line-through}
#starbox{height:76px;min-width:200px;padding:0 22px;border-radius:38px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,#fff8ea,#f6ead0);border:4px solid var(--gold);font-size:44px;font-weight:800;color:var(--wine);position:relative}
#starbox .s{font-family:var(--emoji);font-size:42px}
#starbox.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.18)}}
#vipx{position:absolute;top:-10px;right:-14px;background:#d6283f;color:#fff;font-size:20px;padding:2px 10px;border-radius:14px;border:2px solid var(--goldL)}
#gear{width:76px;height:76px;border-radius:50%;border:4px solid var(--gold);background:rgba(255,248,234,.2);font-size:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}

/* scene */
#scene{position:absolute;left:0;top:110px;width:1150px;height:970px;overflow:hidden;z-index:5}

#house{position:absolute;left:0;top:0}

#orderChip{position:absolute;left:22px;top:22px;padding:12px 20px;border-radius:20px;background:var(--cream);border:4px double var(--goldD);font-size:30px;font-weight:700;color:var(--wine);box-shadow:0 6px 14px rgba(0,0,0,.25);max-width:380px}

.tdLabel{position:absolute;transform:translate(-50%,0);padding:6px 16px;border-radius:16px;background:var(--goldL);color:var(--wineD);font-size:26px;font-weight:800;white-space:nowrap;
  border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.3);animation:popin .35s}
#sceneFx{position:absolute;left:0;top:0;width:1150px;height:970px;pointer-events:none;overflow:hidden}
.fx{position:absolute;font-family:var(--emoji);pointer-events:none}
.heart{font-size:46px;animation:floatUp 1.8s ease-out forwards}

.qmark{font-size:50px;font-weight:800;color:#fff;text-shadow:0 0 6px #7a1f2b,0 3px 0 #7a1f2b;font-family:'Playpen Sans';animation:qm 1.6s ease forwards}
@keyframes qm{0%{transform:translate(-50%,0) scale(0)}20%{transform:translate(-50%,-30px) scale(1.2)}80%{opacity:1}100%{transform:translate(-50%,-40px) scale(1);opacity:0}}
.sparkle{font-size:44px;animation:spk .9s ease-out forwards}
@keyframes spk{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}100%{transform:translate(-50%,-50%) scale(1.6) rotate(120deg);opacity:0}}
.pointHand{font-size:72px;transform:translate(-100%,-50%);animation:pointA .45s ease-in-out infinite alternate}
@keyframes pointA{to{margin-left:-18px}}
.bubbleIcon{font-size:42px;background:#fff;border-radius:26px;padding:4px 12px;border:3px solid var(--gold);transform:translate(-50%,-100%);animation:popin .3s}

#waiter{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:1060px;min-height:130px;padding:20px 34px 20px 150px;border-radius:40px;
  background:linear-gradient(180deg,#8e2635,#5e1520);border:5px solid var(--gold);color:#fff8e6;font-size:40px;font-weight:700;line-height:1.25;
  box-shadow:0 10px 28px rgba(40,6,18,.5);display:flex;align-items:center;z-index:6}
#waiter::before{content:'';position:absolute;left:50%;top:-26px;border:14px solid transparent}
#waiter .who{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:118px;text-align:center;font-size:20px;color:var(--goldL);line-height:1.1}
#waiter .who .e{font-family:var(--emoji);font-size:58px;display:block}
#waiter.pop{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{0%{transform:translateX(-50%) scale(.5);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.tdLabel,.bubbleIcon{animation-name:popin2}
@keyframes popin2{0%{scale:.4;opacity:0}100%{scale:1;opacity:1}}

#bigMsg{position:absolute;left:0;top:0;width:1150px;height:970px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:7}
#bigMsg .t{font-size:64px;font-weight:800;color:#fff;text-shadow:0 4px 0 #7a1f2b,0 0 24px rgba(255,200,120,.9);text-align:center}
#bigMsg .num{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6d0,#e3b448);border:8px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:800;color:var(--wine);margin-top:20px;box-shadow:0 0 50px rgba(255,220,140,.9)}
#bigMsg .num.go{animation:numpop .9s ease-out}
@keyframes numpop{0%{transform:scale(.3)}30%{transform:scale(1.15)}100%{transform:scale(1)}}
#vipBanner{position:absolute;left:50%;top:40px;transform:translateX(-50%);padding:18px 40px;border-radius:30px;background:linear-gradient(180deg,#d6283f,#8e1426);
  border:6px solid var(--goldL);color:#fff;font-size:42px;font-weight:800;text-align:center;z-index:8;box-shadow:0 0 40px rgba(255,220,120,.9);animation:popin .6s;white-space:nowrap}
#vipBanner small{display:block;font-size:28px;color:var(--goldL)}

/* panel */
#panel{position:absolute;left:1166px;top:124px;width:736px;height:942px;display:flex;flex-direction:column;gap:12px;z-index:10}
#speech{position:relative;flex:none;height:186px;border-radius:22px;background:linear-gradient(180deg,#fffdf6,#fbf1dc);padding:16px 112px 14px 138px;
  border:3px solid var(--goldD);box-shadow:inset 0 0 0 5px #fffdf6,inset 0 0 0 8px var(--gold),0 8px 20px rgba(50,10,25,.35);display:flex;flex-direction:column;justify-content:center}
#speech .av{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:108px;height:108px;border-radius:50%;background:#f6e3bf;border:4px solid var(--gold);overflow:hidden}
#speech .who{font-size:23px;font-weight:700;color:#9a6a3a;margin-bottom:2px}
#speech .txt{font-size:35px;font-weight:700;color:var(--wineD);line-height:1.2}
#speech.cust .txt::before{content:'“'} #speech.cust .txt::after{content:'”'}
#speech.pop{animation:cardpop .45s}
@keyframes cardpop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
#speak{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:84px;height:84px;border-radius:50%;border:4px solid var(--gold);
  background:linear-gradient(180deg,#9c2236,#5e1520);font-size:40px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#speak:active{transform:translateY(-50%) scale(.92)}
#instr{flex:none;min-height:72px;padding:10px 22px;border-radius:20px;background:rgba(58,14,30,.82);color:#fff6e0;font-size:28px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:12px;border:3px solid rgba(255,224,138,.6)}
#instr.good{background:rgba(31,110,58,.92);border-color:#9be0a8}
#instr.bad{background:rgba(170,40,40,.92);border-color:#ffb3a8}

#area{position:relative;flex:1;border-radius:24px;background:rgba(255,250,240,.94);border:4px solid var(--gold);box-shadow:0 8px 20px rgba(50,10,25,.3);overflow:hidden}
#custCard{flex:none;height:58px;border-radius:16px;background:rgba(255,248,234,.9);border:3px solid var(--gold);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:24px;font-weight:700;color:var(--wine)}
#custCard .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#custCard .vip{margin-left:auto;white-space:nowrap;background:#d6283f;color:#fff;padding:2px 12px;border-radius:12px;font-size:20px}
#action{flex:none;height:104px;border-radius:52px;border:5px solid var(--goldL);background:linear-gradient(180deg,#a62a3d 0%,#7a1f2b 55%,#5e1520 100%);
  color:#fff3d0;font-size:42px;font-weight:800;cursor:pointer;box-shadow:0 8px 0 #3e0a14,0 12px 24px rgba(40,6,18,.45),inset 0 3px 0 rgba(255,255,255,.25);transition:transform .1s,filter .2s}
#action:active{transform:translateY(5px);box-shadow:0 3px 0 #3e0a14}
#action.wait{filter:grayscale(.75) brightness(.85);pointer-events:none}
#action.glow{animation:glowBtn 1.4s ease-in-out infinite}
@keyframes glowBtn{50%{box-shadow:0 8px 0 #3e0a14,0 0 34px 8px rgba(255,214,120,.85)}}

/* area contents */
.tray{position:absolute;inset:0;display:grid;padding:16px;gap:12px}
.cell{position:relative;border-radius:20px;background:#fff;border:3px dashed #e0c48a;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.cell.used{opacity:.25;pointer-events:none;filter:grayscale(1)}
.cell .lbl{font-size:24px;font-weight:700;color:var(--wine);margin-top:2px;white-space:nowrap}
.cell:active{background:#fff6dc}
.cell.tapped{animation:bump .4s}
.trayHead{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#8a5a3a;font-weight:700}
.menuCard{position:absolute;inset:14px;border-radius:18px;background:#fffdf6;border:3px solid var(--goldD);box-shadow:inset 0 0 0 5px #fffdf6,inset 0 0 0 8px var(--gold);padding:12px 18px;animation:menupop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes menupop{0%{transform:scale(.6) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
.menuCard h3{margin:4px 0 6px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:40px;color:var(--wine)}
.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dish{height:168px;border-radius:18px;border:4px solid #ecdcb8;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .15s}
.dish .lbl{font-size:28px;font-weight:700;color:var(--wine);margin-top:-14px}
.dish.sel{border-color:var(--gold);background:#fff4cf;box-shadow:0 0 0 4px var(--goldL);transform:scale(1.04)}
.dish.sel::after{content:'✓';position:absolute;right:10px;top:6px;width:44px;height:44px;border-radius:50%;background:var(--good);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.dish.locked{pointer-events:none;opacity:.75}
.dish.right{border-color:var(--good);box-shadow:0 0 0 5px #9be0a8}
.dish.wrong{border-color:var(--bad);box-shadow:0 0 0 5px #ffb3a8}
.cards3{position:absolute;inset:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mcard{border-radius:22px;background:#fff;border:4px solid #e8d4a6;display:flex;flex-direction:column;align-items:center;padding:12px 10px;cursor:pointer;position:relative;transition:transform .15s;box-shadow:0 6px 12px rgba(0,0,0,.12)}
.mcard:active{transform:scale(.97)}
.mcard .pic{width:100%;height:190px;border-radius:16px;background:linear-gradient(180deg,#fdf1da,#f3dcb0);position:relative;overflow:hidden}
.mcard .sent{font-size:26px;font-weight:700;line-height:1.22;text-align:center;margin-top:12px;color:var(--ink)}
.mcard.rude{border-color:var(--bad);background:#ffe9e6}
.mcard.polite{border-color:var(--good);background:#eaf8ec}
.mcard .tag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);padding:4px 16px;border-radius:14px;font-size:22px;font-weight:800;color:#fff}
.mcard.rude .tag{background:var(--bad)} .mcard.polite .tag{background:var(--good)}
.mcard.picked{outline:6px solid #3d5a9e;outline-offset:3px}
.ruleCard{position:absolute;left:24px;right:24px;bottom:18px;padding:16px 22px;border-radius:20px;background:var(--cream);border:4px double var(--goldD);font-size:30px;font-weight:700;animation:menupop .5s;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.ruleCard .dont{color:var(--bad)} .ruleCard .do{color:var(--good);font-size:24px;margin-top:6px}
.choices{position:absolute;inset:16px;display:flex;flex-direction:column;gap:14px}
.choice{flex:1;border-radius:24px;border:5px solid #e8d4a6;background:#fff;display:flex;align-items:center;gap:18px;padding:0 24px;cursor:pointer;font-size:40px;font-weight:800;color:var(--wine);text-align:left;transition:transform .15s}
.choice .e{font-family:var(--emoji);font-size:64px}
.choice small{display:block;font-size:24px;color:#7a5a3a;font-weight:700}
.choice:active{transform:scale(.98)}
.choice.right{border-color:var(--good);background:#eaf8ec}
.choice.wrong{border-color:var(--bad);background:#ffe9e6}
.choice.dim{opacity:.45}
.serveBox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:16px}
.courses{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.course{padding:8px 14px;border-radius:16px;background:#f3e6c8;font-size:24px;font-weight:700;color:#8a5a3a;border:3px solid transparent}
.course.cur{background:var(--goldL);border-color:var(--goldD);color:var(--wineD);transform:scale(1.08)}
.course.done{background:#d6f0dc;color:#2f8a4a}
.dragDish{margin-top:14px;width:290px;height:290px;border-radius:30px;background:#fff;border:4px dashed var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;cursor:grab;animation:menupop .5s}
.dragDish .lbl{font-size:34px;font-weight:800;color:var(--wine);margin-top:-14px}
.note{font-size:22px;color:#8a5a3a;font-weight:700;text-align:center;margin-top:10px}
.summary{position:absolute;inset:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.summary .big{font-size:84px;font-weight:800;color:var(--wine)}
.summary .sub{font-size:30px;font-weight:700;color:#7a5a3a}
.dragGhost{position:absolute;pointer-events:none;z-index:60;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
#dragLayer,#fxLayer{position:absolute;inset:0;pointer-events:none;z-index:70}
.flyStar{position:absolute;font-family:var(--emoji);font-size:60px;pointer-events:none;z-index:80}

/* people animations */
.person .mouth>g{display:none}
.person .mouth .m-smile{display:inline}
.r-big .mouth .m-smile,.r-dance .mouth .m-smile{display:none}
.r-big .mouth .m-big,.r-dance .mouth .m-big{display:inline}
.r-confused .mouth .m-smile{display:none} .r-confused .mouth .m-o{display:inline}
.r-funny .mouth .m-smile{display:none} .r-funny .mouth .m-funny{display:inline}
.eating .mouth .m-smile{display:none} .eating .mouth .m-chew{display:inline}
.react{transform-box:fill-box;transform-origin:50% 100%}
.r-big .react,.react.r-big{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-14px)}}
.r-dance .react,.react.r-dance{animation:dance .6s ease-in-out 3}
@keyframes dance{25%{transform:translateY(-10px) rotate(-8deg)}75%{transform:translateY(-10px) rotate(8deg)}}
.headG{transform-box:fill-box;transform-origin:50% 90%}
.r-confused .headIn{animation:tilt 1.6s ease forwards;transform-box:fill-box;transform-origin:50% 90%}
@keyframes tilt{20%,80%{transform:rotate(-16deg)}100%{transform:rotate(0)}}
.r-funny .react,.react.r-funny{animation:shake .25s 5}
@keyframes shake{25%{transform:translateX(-5px) rotate(-3deg)}75%{transform:translateX(5px) rotate(3deg)}}
.walking .bodyAll{animation:walkbob .32s ease-in-out infinite alternate}
@keyframes walkbob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.walking .legL{animation:legA .32s ease-in-out infinite alternate}
.walking .legR{animation:legA .32s ease-in-out infinite alternate-reverse}
@keyframes legA{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.armRin,.armLin{transform-box:fill-box;transform-origin:50% 5%}
.waving .armRin{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-190deg)}}
.eating .armRin{animation:eat 1.1s ease-in-out infinite}
@keyframes eat{0%,100%{transform:rotate(0)}50%{transform:rotate(-70deg)}}
.eating .headIn{animation:nod 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes nod{50%{transform:translateY(2px) rotate(3deg)}}
.pointing .armRin{transform:rotate(-100deg)}
.fadeIn{animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.doorPanel{transform-box:fill-box;transform-origin:0 50%;transition:transform .6s}
.doorPanel.open{transform:scaleX(.18)}
#chefPeek .peekIn>g{animation:peek 3.2s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translateY(18px)}30%,70%{transform:translateY(0)}}
.seatSpot ellipse{animation:dash 1.4s linear infinite}
.seatSpot.taken{display:none}
#tableTarget ellipse{animation:dash 1.4s linear infinite}
.chairActor{cursor:pointer}

/* screens */

.paper{background:var(--cream);border-radius:34px;border:4px solid var(--goldD);box-shadow:inset 0 0 0 7px var(--cream),inset 0 0 0 11px var(--gold),0 20px 60px rgba(30,5,15,.55);position:relative}

.gbox{border-radius:22px;background:#fff;border:3px solid #e8d4a6;padding:12px 16px}

.sigRow{display:flex;gap:8px;justify-content:space-between;text-align:center;font-size:22px;font-weight:700}

.news{border:3px solid #3a2a20;padding:16px 26px;background:#fbf7ec;font-family:'Playpen Sans';position:relative}
.news .mast{text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:70px;border-bottom:4px double #3a2a20;color:#2a1a14}
.news .date{display:flex;justify-content:space-between;font-size:20px;border-bottom:2px solid #3a2a20;padding:4px 0;margin-bottom:10px}
.news .head{font-size:52px;font-weight:800;line-height:1.1;color:#2a1a14}
.news .rstars{font-size:84px;font-family:var(--emoji);letter-spacing:6px;margin:8px 0}
.news .cols{columns:2;column-gap:28px;font-size:26px;line-height:1.4;text-align:justify}
.news .cols p{margin:0 0 10px}
.cert{border-radius:20px;padding:20px 26px;text-align:center;background:linear-gradient(180deg,#fffdf4,#fbefd0);border:6px double var(--goldD);position:relative}
.cert h2{font-family:'Playfair Display',serif;font-style:italic;font-size:64px;margin:4px 0;color:var(--wine)}
.recap{font-size:21px;line-height:1.35;columns:2;column-gap:20px;text-align:left;margin-top:8px}
.recap div{break-inside:avoid;margin-bottom:4px}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div id="skyline"></div>
  <svg id="defs" width="0" height="0" style="position:absolute"><defs id="defsIn"></defs></svg>

  <div id="topbar">
    <div id="sign"><svg width="44" height="64" viewBox="-22 -32 44 64"><g transform="rotate(25)"><ellipse cy="-14" rx="12" ry="16" fill="url(#gGold)"/><rect x="-3.5" y="-2" width="7" height="34" rx="3.5" fill="url(#gGold)"/></g></svg><span class="nm">The Golden Spoon</span></div>
    <div id="pills"></div>
    <div id="starbox"><span class="s">⭐</span><span id="starN">0</span><span id="vipx" class="hidden">×2</span></div>
    <button id="gear" aria-label="Teacher settings" class="emo">⚙️</button>
  </div>

  <div id="scene">
    <div id="sceneWrap"><svg id="house" viewBox="0 0 1150 970" width="1150" height="970"></svg></div>
    <div id="topdown"></div>
    <div id="sceneFx"></div>
    <div id="bigMsg" class="hidden"></div>
    <div id="waiter" class="hidden"><div class="who"><span class="e">🤵</span>Waiters,<br>say:</div><div class="wt"></div></div>
  </div>

  <div id="panel">
    <div id="speech" class="cust"><div class="av"></div><div class="who"></div><div class="txt"></div><button id="speak" class="emo" aria-label="Read aloud">🔊</button></div>
    <div id="instr"></div>
    <div id="area"></div>
    <div id="custCard"></div>
    <button id="action">Next ➜</button>
  </div>

  <div id="dragLayer"></div>
  <div id="fxLayer"></div>

  <div id="start" class="screen dim"></div>
  <div id="guide" class="screen dim hidden"></div>
  <div id="settings" class="screen dim hidden"></div>
  <div id="endScr" class="screen dim hidden"></div>
</div>
<script>
/* ============================================================
   THE GOLDEN SPOON — art module (all SVG drawings, built in code)
   ============================================================ */
'use strict';

/* ---------- isometric helpers ---------- */
const ISO = { cx: 560, cy: 310, tw: 50, th: 29, N: 8, WH: 280 };
const UX = 0.865, UY = 0.502, WL = 462;           // wall direction & length
function iso(i, j) { return { x: ISO.cx + (i - j) * ISO.tw, y: ISO.cy + (i + j) * ISO.th }; }
const LEFT_WALL = 'matrix(0.865,-0.502,0,1,160,262)';  // u: front-left corner -> back corner
const RIGHT_WALL = 'matrix(0.865,0.502,0,1,560,30)';   // u: back corner -> front-right corner
function leftWallPt(u, v) { return { x: 160 + UX * u, y: 262 - UY * u + v }; }
function rightWallPt(u, v) { return { x: 560 + UX * u, y: 30 + UY * u + v }; }

const TABLE = { i: 4.5, j: 4.5 };
const SEAT_R = 1.95;
const SEAT_SPOTS = [];
for (let k = 0; k < 8; k++) {
  const a = (k * 45 + 22.5) * Math.PI / 180;
  SEAT_SPOTS.push({ i: TABLE.i + SEAT_R * Math.cos(a), j: TABLE.j + SEAT_R * Math.sin(a) });
}
const ENTRANCE = { i: 0.25, j: 6.75 };
const ARRIVE_SPOTS = [
  { i: 1.1, j: 7.3 }, { i: 2.0, j: 7.4 }, { i: 1.2, j: 6.2 },
  { i: 2.9, j: 7.45 }, { i: 2.1, j: 6.35 }, { i: 1.3, j: 5.1 }
];
const KITCHEN = { i: 6.4, j: 0.45 };
const CHEF_SERVE = { i: 7.25, j: 3.1 };
const CHEF_BYE = { i: 7.2, j: 5.9 };

/* ---------- tiny utils ---------- */
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ---------- global defs (gradients/patterns shared by every SVG) ---------- */
function globalDefs() {
  return `
  <linearGradient id="gMetal" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#8e98a3"/><stop offset=".35" stop-color="#f4f7fa"/>
    <stop offset=".55" stop-color="#c9d1d9"/><stop offset="1" stop-color="#7c8792"/></linearGradient>
  <linearGradient id="gMetalV" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#eef2f5"/><stop offset="1" stop-color="#9aa4ae"/></linearGradient>
  <linearGradient id="gGold" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#fff1b3"/><stop offset=".45" stop-color="#e3b448"/><stop offset="1" stop-color="#a8761c"/></linearGradient>
  <linearGradient id="gWood" x1="0" x2="1">
    <stop offset="0" stop-color="#8a5a32"/><stop offset=".5" stop-color="#a8703f"/><stop offset="1" stop-color="#7a4c27"/></linearGradient>
  <linearGradient id="gWoodDark" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#6e4122"/><stop offset="1" stop-color="#4a2a14"/></linearGradient>
  <linearGradient id="gJuice" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffcf4a"/><stop offset="1" stop-color="#ff8f1f"/></linearGradient>
  <linearGradient id="gWine" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#8e2635"/><stop offset="1" stop-color="#5e1520"/></linearGradient>
  <linearGradient id="gWinSky" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#5b3f8f"/><stop offset=".38" stop-color="#d9628e"/>
    <stop offset=".7" stop-color="#ff9466"/><stop offset="1" stop-color="#ffd59a"/></linearGradient>
  <radialGradient id="gGlow"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/>
    <stop offset=".4" stop-color="#ffd877" stop-opacity=".45"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="gPool"><stop offset="0" stop-color="#ffe7a6" stop-opacity=".55"/>
    <stop offset="1" stop-color="#ffcf70" stop-opacity="0"/></radialGradient>
  <radialGradient id="gPorthole"><stop offset="0" stop-color="#fff6cf"/><stop offset=".7" stop-color="#ffd27a"/><stop offset="1" stop-color="#f2a43a"/></radialGradient>
  <radialGradient id="gPlate" cx=".45" cy=".4"><stop offset="0" stop-color="#ffffff"/><stop offset=".8" stop-color="#f4f1ea"/><stop offset="1" stop-color="#e2ddd2"/></radialGradient>
  <radialGradient id="gCloth" cx=".5" cy=".35"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ece6da"/></radialGradient>
  <pattern id="pWall" width="34" height="34" patternUnits="userSpaceOnUse">
    <rect width="34" height="34" fill="#f7ecd3"/>
    <path d="M17 3 L31 17 L17 31 L3 17Z" fill="none" stroke="#d8b25a" stroke-width="1.6" opacity=".8"/>
    <circle cx="17" cy="17" r="2" fill="#d8b25a" opacity=".8"/>
    <circle cx="0" cy="0" r="1.6" fill="#e6c77d"/><circle cx="34" cy="0" r="1.6" fill="#e6c77d"/>
    <circle cx="0" cy="34" r="1.6" fill="#e6c77d"/><circle cx="34" cy="34" r="1.6" fill="#e6c77d"/>
  </pattern>
  <pattern id="pCloth" width="60" height="60" patternUnits="userSpaceOnUse">
    <rect width="60" height="60" fill="#fbf8f2"/>
    <path d="M0 30 H60 M30 0 V60" stroke="#efe8da" stroke-width="2"/>
  </pattern>
  <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="fSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="fShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3b1020" flood-opacity=".35"/></filter>`;
}

/* ============================================================
   PEOPLE
   ============================================================ */
const SKINS = ['#FFE0C2', '#F6C9A0', '#E3A878', '#C68650', '#8F5A35', '#6B3F24'];
const HAIRS = ['#3b2414', '#1f1712', '#7a4a22', '#d9a441', '#b5542b', '#2c2c3a'];
const OUTFITS = ['#3d5a9e', '#2f7d6d', '#8a3b7a', '#c2414f', '#e08a2e', '#5a4a9a', '#2b6c99', '#9c5b2e', '#d4577a', '#4a8a3a'];

function eyes(cy, glasses, kind) {
  let s = `<g class="eyes">
    <ellipse cx="-7" cy="${cy}" rx="2.6" ry="3.4" fill="#2a1a14"/><ellipse cx="7" cy="${cy}" rx="2.6" ry="3.4" fill="#2a1a14"/>
    <circle cx="-6.2" cy="${cy - 1.3}" r="1" fill="#fff"/><circle cx="7.8" cy="${cy - 1.3}" r="1" fill="#fff"/></g>`;
  if (kind === 'star') {
    s = `<g><rect x="-17" y="${cy - 5}" width="14" height="9" rx="4" fill="#1e1e2e"/><rect x="3" y="${cy - 5}" width="14" height="9" rx="4" fill="#1e1e2e"/>
      <path d="M-3 ${cy - 2} H3" stroke="#1e1e2e" stroke-width="2"/><path d="M-14 ${cy - 3} l4 0" stroke="#fff" stroke-width="1.5" opacity=".7"/></g>`;
  }
  if (glasses) s += `<g fill="none" stroke="#5a3b22" stroke-width="1.6"><circle cx="-7" cy="${cy}" r="5.5"/><circle cx="7" cy="${cy}" r="5.5"/><path d="M-1.5 ${cy} H1.5"/></g>`;
  return s;
}
function mouths(cy) {
  return `<g class="m-smile"><path d="M-6 ${cy} Q0 ${cy + 6} 6 ${cy}" stroke="#7a2e2a" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>
  <g class="m-big"><path d="M-7 ${cy - 1} Q0 ${cy + 10} 7 ${cy - 1}Z" fill="#7a2e2a"/><path d="M-4 ${cy + 3} Q0 ${cy + 6} 4 ${cy + 3}" fill="#e46a74"/></g>
  <g class="m-o"><ellipse cx="2" cy="${cy + 2}" rx="3" ry="3.6" fill="#7a2e2a"/></g>
  <g class="m-funny"><path d="M-7 ${cy} Q-3 ${cy - 3} 0 ${cy} T7 ${cy}" stroke="#7a2e2a" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M1 ${cy + 1} q3 7 6 0" fill="#e46a74"/></g>
  <g class="m-chew"><path d="M-4 ${cy + 1} H4" stroke="#7a2e2a" stroke-width="2.4" stroke-linecap="round"/></g>`;
}

/* Draw the head (centered at 0,0, radius 20) for a member */
function headSVG(m) {
  const sk = m.skin, hr = m.hair, k = m.kind;
  let back = '', front = '', top = '', extra = '';
  if (['lady', 'woman', 'queen', 'star', 'princess', 'girl'].includes(k)) {
    back = `<path d="M-22 -4 Q-24 -24 0 -24 Q24 -24 22 -4 L23 ${k === 'girl' ? 6 : 16} Q14 20 12 6 L-12 6 Q-14 20 -23 ${k === 'girl' ? 6 : 16}Z" fill="${hr}"/>`;
    front = `<path d="M-19 -6 Q-16 -21 0 -21 Q16 -21 19 -6 Q10 -14 2 -12 Q-8 -16 -19 -6Z" fill="${hr}"/>`;
  } else if (k === 'grandma') {
    back = `<circle cx="0" cy="-22" r="9" fill="${hr}"/>`;
    front = `<path d="M-19 -4 Q-18 -21 0 -21 Q18 -21 19 -4 Q10 -13 0 -12 Q-10 -13 -19 -4Z" fill="${hr}"/>`;
  } else if (k === 'grandpa') {
    front = `<path d="M-20 -2 Q-21 -12 -15 -14 Q-12 -6 -17 4Z M20 -2 Q21 -12 15 -14 Q12 -6 17 4Z" fill="${hr}"/>`;
  } else if (k !== 'chef' && k !== 'chefvip') {
    front = `<path d="M-20 -4 Q-20 -23 0 -22 Q20 -23 20 -4 Q14 -14 4 -15 Q-6 -12 -20 -4Z" fill="${hr}"/>`;
  }
  // accessories on top
  if (k === 'lady') {
    top = `<ellipse cx="0" cy="-17" rx="33" ry="7" fill="${m.acc}"/><path d="M-17 -18 Q-17 -38 0 -38 Q17 -38 17 -18Z" fill="${m.acc}"/>
      <rect x="-17" y="-25" width="34" height="5" fill="${shade(m.acc, -40)}"/>
      <circle cx="12" cy="-27" r="6" fill="#ff8fb1"/><circle cx="12" cy="-27" r="2.4" fill="#ffd34d"/>
      <path d="M15 -30 Q30 -48 22 -26" fill="#fff2d6" stroke="#e8c98f" stroke-width="1"/>`;
  } else if (k === 'girl' || k === 'princess') {
    if (k === 'girl') top = `<g transform="translate(0,-21)"><path d="M0 0 L-14 -8 L-14 8Z M0 0 L14 -8 L14 8Z" fill="${m.acc}"/><circle r="4" fill="${shade(m.acc, -30)}"/></g>`;
    back += `<circle cx="-22" cy="4" r="7" fill="${hr}"/><circle cx="22" cy="4" r="7" fill="${hr}"/>`;
  } else if (k === 'boy' || k === 'prince') {
    if (k === 'boy' && m.cap) top = `<path d="M-19 -10 Q-19 -27 0 -27 Q19 -27 19 -10Z" fill="${m.acc}"/><path d="M8 -11 Q22 -13 28 -9 L19 -9Z" fill="${shade(m.acc, -30)}"/>`;
  }
  if (k === 'king' || k === 'prince') {
    const s = k === 'king' ? 1 : 0.75;
    top = `<g transform="translate(0,-21) scale(${s})"><path d="M-16 0 L-18 -20 L-8 -10 L0 -24 L8 -10 L18 -20 L16 0Z" fill="url(#gGold)" stroke="#a8761c" stroke-width="1"/>
      <circle cx="0" cy="-6" r="3" fill="#e0314b"/><circle cx="-10" cy="-5" r="2.2" fill="#3a7bd5"/><circle cx="10" cy="-5" r="2.2" fill="#3fbf6f"/>
      <circle cx="0" cy="-24" r="2.4" fill="#fff4b8"/></g>`;
  }
  if (k === 'queen' || k === 'princess') {
    top = `<g transform="translate(0,-20)"><path d="M-13 2 Q-12 -9 -6 -6 Q-3 -15 0 -16 Q3 -15 6 -6 Q12 -9 13 2Z" fill="url(#gGold)" stroke="#a8761c"/>
      <circle cx="0" cy="-9" r="2.6" fill="#d23aa0"/></g>`;
  }
  if (k === 'chef' || k === 'chefvip') {
    top = `<g transform="translate(0,-18)"><rect x="-14" y="-6" width="28" height="9" fill="#fff" stroke="#ddd"/>
      <circle cx="-10" cy="-14" r="9" fill="#fff"/><circle cx="10" cy="-14" r="9" fill="#fff"/><circle cx="0" cy="-20" r="11" fill="#fff"/>
      <path d="M-14 -6 Q-19 -12 -15 -17 M14 -6 Q19 -12 15 -17" stroke="#e6e6e6" fill="none"/></g>`;
    front = `<path d="M-20 -6 Q-20 -14 -14 -16 L-14 -6Z M20 -6 Q20 -14 14 -16 L14 -6Z" fill="${hr}"/>`;
  }
  if (k === 'star') extra = `<path d="M17 -17 l2 5 5 .5 -4 3.4 1.3 5 -4.3 -2.8 -4.3 2.8 1.3 -5 -4 -3.4 5 -.5Z" fill="#ffd94a" stroke="#c99a1b" stroke-width=".8"/>`;
  const mustache = (['gent', 'grandpa', 'chef', 'chefvip', 'king'].includes(k))
    ? `<path d="M0 6 Q-6 2 -12 6 Q-15 9 -18 5 Q-15 13 -6 10 Q-2 9 0 8 Q2 9 6 10 Q15 13 18 5 Q15 9 12 6 Q6 2 0 6Z" fill="${k === 'grandpa' ? '#e8e8e8' : (k === 'king' ? '#8a5a2b' : '#3a2414')}"/>` : '';
  const beard = k === 'king' ? `<path d="M-14 6 Q-14 24 0 26 Q14 24 14 6 Q8 14 0 14 Q-8 14 -14 6Z" fill="#8a5a2b"/>` : '';
  return `${back}<circle r="20" fill="${sk}"/>
    <ellipse cx="-20" cy="2" rx="3.5" ry="5" fill="${shade(sk, -15)}"/><ellipse cx="20" cy="2" rx="3.5" ry="5" fill="${shade(sk, -15)}"/>
    ${front}${eyes(-1, m.glasses, k)}
    <circle cx="-12" cy="7" r="4.2" fill="#ff8f9a" opacity=".55"/><circle cx="12" cy="7" r="4.2" fill="#ff8f9a" opacity=".55"/>
    <g class="mouth">${mouths(9)}</g>${beard}${mustache}${top}${extra}`;
}

/* Torso + arms (hip at y=0, shoulders at y=-36). Returns string. */
function torsoSVG(m) {
  const c = m.outfit, k = m.kind, sk = m.skin;
  const dress = ['lady', 'woman', 'queen', 'star', 'princess', 'girl', 'grandma'].includes(k);
  let body;
  if (dress) {
    body = `<path d="M-13 -36 Q0 -40 13 -36 L16 -14 Q24 4 22 8 L-22 8 Q-24 4 -16 -14Z" fill="${c}"/>
      <path d="M-16 -14 Q0 -10 16 -14" stroke="${shade(c, -35)}" stroke-width="3" fill="none"/>`;
    if (k === 'star') body += `<g fill="#fff" opacity=".85"><circle cx="-8" cy="-4" r="1.4"/><circle cx="6" cy="-20" r="1.2"/><circle cx="10" cy="2" r="1.4"/><circle cx="-4" cy="-26" r="1"/><circle cx="-12" cy="4" r="1"/></g>`;
    if (k === 'grandma' || k === 'woman' || k === 'queen') body += `<g fill="#fffaf0">${[-8, -4, 0, 4, 8].map((x, i) => `<circle cx="${x}" cy="${-33 + Math.abs(x) * -0.15 + (i === 2 ? 3 : 2)}" r="1.8"/>`).join('')}</g>`;
  } else {
    body = `<path d="M-14 -36 Q0 -40 14 -36 L15 0 L-15 0Z" fill="${c}"/>`;
    if (k === 'gent' || k === 'man' || k === 'grandpa') {
      body += `<path d="M-5 -37 L0 -18 L5 -37Z" fill="#fff"/><path d="M-14 -36 L-3 -36 L0 -14 L-4 0" stroke="${shade(c, -30)}" stroke-width="2" fill="none"/>
        <path d="M14 -36 L3 -36 L0 -14 L4 0" stroke="${shade(c, -30)}" stroke-width="2" fill="none"/>`;
      if (k === 'gent') body += `<path d="M0 -34 L-8 -38 L-8 -30Z M0 -34 L8 -38 L8 -30Z" fill="${m.acc}"/><circle cy="-34" r="2.2" fill="${shade(m.acc, -30)}"/>`;
      if (k === 'man') body += `<path d="M0 -35 L-3 -31 L0 -16 L3 -31Z" fill="${m.acc}"/>`;
      if (k === 'grandpa') body += `<circle cx="0" cy="-10" r="1.6" fill="#ead9b0"/><circle cx="0" cy="-4" r="1.6" fill="#ead9b0"/>`;
    }
    if (k === 'boy') body += `<path d="M-8 -37 L-8 0 M8 -37 L8 0" stroke="${m.acc}" stroke-width="3"/><path d="M0 -35 L-5 -38 L-5 -32Z M0 -35 L5 -38 L5 -32Z" fill="${m.acc}"/>`;
    if (k === 'chef' || k === 'chefvip') body += `<circle cx="-5" cy="-24" r="1.8" fill="#bbb"/><circle cx="5" cy="-24" r="1.8" fill="#bbb"/><circle cx="-5" cy="-14" r="1.8" fill="#bbb"/><circle cx="5" cy="-14" r="1.8" fill="#bbb"/>
      <path d="M-9 -37 Q0 -30 9 -37 L5 -32 Q0 -29 -5 -32Z" fill="${k === 'chef' ? '#d64545' : '#2f6fd6'}"/>`;
    if (k === 'king' || k === 'prince') body += `<rect x="-15" y="-8" width="30" height="5" fill="url(#gGold)"/>`;
  }
  let cape = '';
  if (k === 'king' || k === 'queen') cape = `<path d="M-14 -36 Q-26 -10 -25 8 L25 8 Q26 -10 14 -36Z" fill="#b3203a"/>
    <path d="M-16 -38 Q0 -30 16 -38 Q14 -32 0 -30 Q-14 -32 -16 -38Z" fill="#fff" stroke="#ddd"/><g fill="#222"><circle cx="-8" cy="-34" r="1"/><circle cx="6" cy="-34" r="1"/></g>`;
  const sleeve = dress ? shade(c, -10) : shade(c, -15);
  const hand = `<circle cx="0" cy="26" r="5" fill="${sk}"/>`;
  const arms = `<g class="armL" transform="translate(-14,-34)"><g class="armLin"><path d="M0 0 Q-7 12 -3 24 L3 24 Q2 12 5 2Z" fill="${sleeve}"/><g transform="translate(0,0)">${hand}</g></g></g>
    <g class="armR" transform="translate(14,-34)"><g class="armRin"><path d="M0 0 Q7 12 3 24 L-3 24 Q-2 12 -5 2Z" fill="${sleeve}"/>${hand}</g></g>`;
  return cape + body + arms;
}

/* Full person. Standing: feet at (0,0). Seated: seat at y=0 (place group at seat height). */
function personSVG(m, opts = {}) {
  const sc = m.scale || 1;
  const seated = !!opts.seated;
  const c = m.outfit;
  const dress = ['lady', 'woman', 'queen', 'star', 'princess', 'girl', 'grandma'].includes(m.kind);
  const pants = m.pants || shade(c, -45);
  const shoe = '#3a2418';
  let legs;
  if (!seated) {
    legs = dress
      ? `<g class="legs"><rect x="-10" y="-34" width="7" height="32" fill="${m.skin}"/><rect x="3" y="-34" width="7" height="32" fill="${m.skin}"/>

function floorSVG() {
  let s = '';
  const n = 16, st = 8 / n;
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
    const p = [iso(a * st, b * st), iso((a + 1) * st, b * st), iso((a + 1) * st, (b + 1) * st), iso(a * st, (b + 1) * st)];
    s += `<polygon points="${p.map(q => q.x + ',' + q.y).join(' ')}" fill="${(a + b) % 2 ? '#bcd3e8' : '#fbf4e4'}"/>`;
  }
  const A = iso(0, 8), B = iso(8, 8), C = iso(8, 0);
  // slab front faces
  s += `<polygon points="${A.x},${A.y} ${B.x},${B.y} ${B.x},${B.y + 24} ${A.x},${A.y + 24}" fill="#7b4a2a"/>
    <polygon points="${B.x},${B.y} ${C.x},${C.y} ${C.x},${C.y + 24} ${B.x},${B.y + 24}" fill="#5c3419"/>
    <polyline points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" fill="none" stroke="#e3b448" stroke-width="4"/>
    <polyline points="${A.x},${A.y + 24} ${B.x},${B.y + 24} ${C.x},${C.y + 24}" fill="none" stroke="#3e220f" stroke-width="2"/>`;
  return s;
}

function fairyLights(id) {
  let s = `<path d="M0 12 ${Array.from({ length: 6 }, (_, k) => `Q${k * 77 + 38} 30 ${(k + 1) * 77} 12`).join(' ')}" stroke="#4a3a22" stroke-width="1.4" fill="none"/>`;
  const cols = ['#ffe28a', '#ffb86b', '#ff94a8', '#fff4c2', '#a8e6ff'];
  for (let k = 0; k < 6; k++) for (let t = 1; t <= 4; t++) {
    const tt = t / 5, x = k * 77 + 77 * tt, y = 12 + 2 * (1 - tt) * tt * 18 * 2 * 0.5 * 2;
    const c = cols[(k * 4 + t) % cols.length];
    s += `<g class="twinkle" style="animation-delay:${((k * 4 + t) * 0.37) % 3}s"><circle cx="${x}" cy="${y + 4}" r="7" fill="${c}" opacity=".5" filter="url(#fGlow)"/><circle cx="${x}" cy="${y + 4}" r="3.4" fill="${c}"/></g>`;
  }
  return `<g id="${id}">${s}</g>`;
}

/* ============================================================
   SKY + PARIS SKYLINE
   ============================================================ */
function eiffelSVG(x, base, h, col, lit) {
  const w = h * 0.36;
  const p = (fx, fy) => `${x + fx * w},${base - fy * h}`;
  let s = `<g class="eiffel">`;
  const legL = `M${p(-0.5, 0)} Q${p(-0.3, 0.12)} ${p(-0.17, 0.32)} L${p(-0.1, 0.55)} L${p(-0.035, 0.92)} L${p(0, 1)}`;
  const legR = `M${p(0.5, 0)} Q${p(0.3, 0.12)} ${p(0.17, 0.32)} L${p(0.1, 0.55)} L${p(0.035, 0.92)} L${p(0, 1)}`;
  s += `<path d="${legL} ${legR.replace('M', 'L')}" fill="none"/>`;
  // solid silhouette (slim)
  s += `<path d="M${p(-0.5, 0)} Q${p(-0.3, 0.12)} ${p(-0.17, 0.32)} L${p(-0.1, 0.55)} L${p(-0.035, 0.92)} L${p(0, 1.0)} L${p(0.035, 0.92)} L${p(0.1, 0.55)} L${p(0.17, 0.32)} Q${p(0.3, 0.12)} ${p(0.5, 0)} L${p(0.36, 0)} Q${p(0.2, 0.16)} ${p(0, 0.17)} Q${p(-0.2, 0.16)} ${p(-0.36, 0)}Z" fill="${col}"/>`;
  // lattice: crossing lines inside each leg band
  let lat = '';
  const rows = 22;
  for (let r = 0; r < rows; r++) {
    const f0 = r / rows, f1 = (r + 1) / rows;
    const half = f => (f < 0.32 ? 0.5 - (0.5 - 0.17) * (f / 0.32) : f < 0.55 ? 0.17 - 0.07 * ((f - 0.32) / 0.23) : 0.1 - 0.065 * ((f - 0.55) / 0.37));
    const a0 = half(f0) * w, a1 = half(f1) * w;
    const y0 = base - f0 * h * 0.92, y1 = base - f1 * h * 0.92;
    lat += `M${x - a0} ${y0} L${x - a1 * 0.4} ${y1} M${x - a0 * 0.4} ${y0} L${x - a1} ${y1} M${x + a0} ${y0} L${x + a1 * 0.4} ${y1} M${x + a0 * 0.4} ${y0} L${x + a1} ${y1} `;
  }
  s += `<path d="${lat}" stroke="${shade(col, 40)}" stroke-width="${Math.max(0.6, h / 400)}" fill="none" opacity=".55"/>`;
  // platforms
  s += `<rect x="${x - w * 0.24}" y="${base - h * 0.33}" width="${w * 0.48}" height="${h * 0.022}" fill="${shade(col, -15)}"/>
        <rect x="${x - w * 0.13}" y="${base - h * 0.57}" width="${w * 0.26}" height="${h * 0.018}" fill="${shade(col, -15)}"/>
        <rect x="${x - w * 0.045}" y="${base - h * 0.9}" width="${w * 0.09}" height="${h * 0.02}" fill="${shade(col, -15)}"/>
        <rect x="${x - 1}" y="${base - h * 1.05}" width="2" height="${h * 0.06}" fill="${col}"/>`;
  if (lit) s += `<circle cx="${x}" cy="${base - h * 1.05}" r="4" fill="#ffe9a3" class="beacon"/>`;
  return s + '</g>';
}

function buildingSVG(x, w, base, h, col, rand, lit) {
  let s = '';
  const roofH = 22 + rand() * 12;
  const top = base - h;
  // body
  s += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${col}"/>`;
  // mansard roof (sloped)
  const rc = shade(col, -28);
  s += `<path d="M${x - 3} ${top} L${x + 8} ${top - roofH} L${x + w - 8} ${top - roofH} L${x + w + 3} ${top}Z" fill="${rc}"/>`;
  s += `<rect x="${x - 4}" y="${top - 3}" width="${w + 8}" height="4" fill="${shade(col, 18)}"/>`;
  // chimneys
  const nc = 1 + Math.floor(rand() * 3);
  for (let c = 0; c < nc; c++) {
    const cx = x + 12 + rand() * (w - 30);
    s += `<rect x="${cx}" y="${top - roofH - 12}" width="9" height="14" fill="${shade(col, -18)}"/><rect x="${cx - 1.5}" y="${top - roofH - 14}" width="12" height="3" fill="${shade(col, -35)}"/>`;
    s += `<rect x="${cx + 1}" y="${top - roofH - 17}" width="3" height="3" fill="${shade(col, -40)}"/><rect x="${cx + 5}" y="${top - roofH - 17}" width="3" height="3" fill="${shade(col, -40)}"/>`;
  }
  // dormer windows
  const cols = Math.max(2, Math.floor((w - 10) / 22));
  const gap = (w - 10) / cols;
  for (let c = 0; c < cols; c++) {
    const dx = x + 5 + c * gap + gap / 2;
    if (rand() < 0.7) {
      const on = lit && rand() < 0.35;
      s += `<path d="M${dx - 6} ${top - 4} V${top - roofH * 0.55} L${dx} ${top - roofH * 0.8} L${dx + 6} ${top - roofH * 0.55} V${top - 4}Z" fill="${shade(col, 8)}"/>
            <rect x="${dx - 3.5}" y="${top - roofH * 0.55}" width="7" height="${roofH * 0.42}" fill="${on ? '#ffd77a' : shade(col, -40)}"/>`;
    }
  }
  // window rows with balconies
  const floors = Math.max(2, Math.floor((h - 14) / 30));
  for (let f = 0; f < floors; f++) {
    const wy = top + 10 + f * 30;
    for (let c = 0; c < cols; c++) {
      const wx = x + 5 + c * gap + gap / 2 - 5;
      const on = lit && rand() < 0.3;
      s += `<rect x="${wx}" y="${wy}" width="10" height="17" rx="${f === 0 ? 5 : 1}" fill="${on ? '#ffd77a' : shade(col, -38)}"/>`;
      if (on) s += `<rect x="${wx - 2}" y="${wy - 2}" width="14" height="21" fill="#ffcf6b" opacity=".25"/>`;
    }
    if (f === 1 || (f === floors - 1 && floors > 3)) {
      s += `<rect x="${x + 2}" y="${wy + 17}" width="${w - 4}" height="2.5" fill="${shade(col, -45)}"/>`;
      let rail = '';
      for (let r = x + 4; r < x + w - 3; r += 4) rail += `M${r} ${wy + 11} V${wy + 17} `;
      s += `<path d="${rail}M${x + 3} ${wy + 11} H${x + w - 3}" stroke="${shade(col, -45)}" stroke-width="1.1"/>`;
    }
  }
  // ground floor shop
  if (rand() < 0.5) s += `<rect x="${x + 4}" y="${base - 20}" width="${w - 8}" height="20" fill="${shade(col, -30)}"/>` +
    `<path d="M${x + 2} ${base - 22} h${w - 4} l-4 8 h-${w - 12}Z" fill="${pick(['#b3283f', '#2f7d6d', '#3d5a9e'])}" opacity=".9"/>` +
    (lit ? `<rect x="${x + 8}" y="${base - 12}" width="${w - 16}" height="10" fill="#ffd77a" opacity=".8"/>` : '');
  return s;
}

function domeSVG(x, base, s, col, lit) {

    <rect x="-40" y="-100" width="80" height="40" fill="${shade(col, 6)}"/>

function skylineSVG() {
  const W = 1920, H = 380, B = H;
  const r = seeded(77);
  let back = '', front = '';
  // back row (lighter)
  let x = -20;
  while (x < W) {
    const w = 70 + r() * 60, h = 110 + r() * 80;
    back += buildingSVG(x, w, B - 40, h, '#9a6a9e', r, false);
    x += w + 2 + r() * 6;
  }
  back += domeSVG(1410, B - 40, 0.95, '#a7779f', false);
  back += eiffelSVG(1745, B - 60, 330, '#7b4e83', true);
  back += eiffelSVG(92, B - 30, 360, '#6c3f73', true);
  // front row (darker)
  x = -10;
  while (x < W) {
    const w = 80 + r() * 70, h = 70 + r() * 70;
    front += buildingSVG(x, w, B, h, '#4b2a4f', r, true);
    x += w + r() * 4;
  }
  let trees = '';
  for (let tx = 30; tx < W; tx += 90 + r() * 70) trees += treeSVG(tx, B, 16 + r() * 8, r() < 0.5 ? '#2f3a3a' : '#35422f');
  let lamps = '';
  for (let lx = 70; lx < W; lx += 160) lamps += lampSVG(lx + r() * 20, B, 60);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="none">
    <rect x="0" y="${B - 70}" width="${W}" height="70" fill="#6b3b62" opacity=".35"/>
    <g opacity=".95">${back}</g>
    <rect x="0" y="${B - 130}" width="${W}" height="130" fill="#ff9a7a" opacity=".12"/>
    <g>${front}</g>${trees}${lamps}
  </svg>`;
}

function starsSVG() {
  const r = seeded(9);
  let s = '';
  for (let k = 0; k < 46; k++) {
    const x = r() * 1920, y = r() * 360, rr = 0.8 + r() * 1.8;
    s += `<circle class="twinkle" style="animation-delay:${(r() * 4).toFixed(2)}s" cx="${x}" cy="${y}" r="${rr}" fill="#fff7e0"/>`;
  }
  s += `<g fill="#fff7e0" opacity=".9"><path class="twinkle" d="M300 60 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3Z"/><path class="twinkle" style="animation-delay:1.3s" d="M1080 290 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3Z"/></g>`;
  s += `<circle cx="1075" cy="190" r="26" fill="#fff4d6" opacity=".9"/><circle cx="1087" cy="182" r="24" fill="#7d4a8e" opacity=".6"/>`;
  return `<svg viewBox="0 0 1920 400" width="1920" height="400">${s}</svg>`;
}

/* ---------- plate signals (big plate, top-down) ---------- */
function signalPlateSVG(kind, cx, cy, r, withFood) {
  let ut = '';
  const F = (x, y, rot, s) => `<g transform="translate(${cx + x},${cy + y}) rotate(${rot})">${UT.fork(s)}</g>`;
  const K = (x, y, rot, s) => `<g transform="translate(${cx + x},${cy + y}) rotate(${rot})">${UT.knife(s)}</g>`;
  const s = r / 230 * 1.05;
  const u = r / 230;
  if (kind === 'pause') {
    // apart, tips together near the top (upside-down V); knife blade faces the fork
    ut = F(-78 * u, 12 * u, 28, s) + K(78 * u, 12 * u, -28, s);
  } else if (kind === 'finished') {
    // together, side by side on the 10-4 o'clock line, handles at 4 o'clock
    const cx0 = 26 * u, cy0 = 16 * u, d = 24 * u;
    ut = F(cx0 - 0.5 * d, cy0 + 0.866 * d, -60, s) + K(cx0 + 0.5 * d, cy0 - 0.866 * d, -60, s);
  } else {
    // together, side by side, lying horizontally across the plate
    ut = K(0, -26 * u, -90, s) + F(0, 26 * u, -90, s);
  }
  const food = withFood
    ? `<text x="${cx - r * 0.18}" y="${cy + r * 0.32}" font-size="${r * 0.42}" text-anchor="middle">🥩</text><text x="${cx + r * 0.28}" y="${cy - r * 0.08}" font-size="${r * 0.25}" text-anchor="middle">🥔</text>`
    : `<path d="M${cx - r * 0.3} ${cy + r * 0.25} q${r * 0.2} -${r * 0.12} ${r * 0.42} -${r * 0.02} q-${r * 0.1} ${r * 0.1} -${r * 0.3} ${r * 0.1}Z" fill="#b5542b" opacity=".35"/><circle cx="${cx + r * 0.2}" cy="${cy + r * 0.3}" r="${r * 0.03}" fill="#8a4a24" opacity=".5"/><circle cx="${cx - r * 0.35}" cy="${cy - r * 0.1}" r="${r * 0.025}" fill="#8a4a24" opacity=".5"/>`;
  const clock = `<g font-size="${r * 0.09}" fill="#c9a24a" font-weight="700" text-anchor="middle" opacity=".9">
      ${[12, 3, 6, 9].map((h, k) => { const a = k * Math.PI / 2; return `<text x="${cx + Math.sin(a) * (r - r * 0.1)}" y="${cy - Math.cos(a) * (r - r * 0.1) + r * 0.03}">${h}</text>`; }).join('')}</g>`;
  return `<g>${plateTopSVG(cx, cy, r)}${clock}${food}${ut}</g>`;
}

let AC = null, MASTER = null, MUSIC_GAIN = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination);
      MUSIC_GAIN = AC.createGain(); MUSIC_GAIN.gain.value = 0; MUSIC_GAIN.connect(MASTER);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, t0, dur, { type = 'sine', vol = 0.2, attack = 0.005, dest = null, slide = 0 } = {}) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || MASTER); o.start(t0); o.stop(t0 + dur + 0.05);
}

/* soft café waltz (accordion + piano), generated in code */
const MUS = { on: false, timer: null, next: 0, bar: 0 };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = { F: [53, 57, 60, 65], C7: [48, 52, 55, 58], Bb: [46, 50, 53, 58], Dm: [50, 53, 57, 62], Gm: [43, 50, 55, 58] };
const PROG = ['F', 'C7', 'F', 'Bb', 'F', 'C7', 'Dm', 'C7', 'Bb', 'F', 'C7', 'F', 'Bb', 'F', 'C7', 'F'];
const MEL = [
  [[69, 1], [72, 1], [77, 1]], [[76, 2], [74, 1]], [[72, 1], [69, 1], [72, 1]], [[74, 2], [70, 1]],
  [[69, 1], [72, 1], [77, 1]], [[79, 1], [77, 1], [76, 1]], [[77, 1], [74, 1], [69, 1]], [[70, 1], [69, 1], [67, 1]],
  [[74, 1], [77, 1], [74, 1]], [[72, 2], [69, 1]], [[70, 1], [67, 1], [64, 1]], [[65, 2], [69, 1]],
  [[74, 1], [70, 1], [74, 1]], [[72, 1], [69, 1], [65, 1]], [[67, 1], [70, 1], [76, 1]], [[77, 3]]
];
function accordion(notes, t0, dur, vol) {
  const g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 1300; f.Q.value = 0.7;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.04);
  g.gain.setValueAtTime(vol, t0 + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 5.5; lg.gain.value = vol * 0.25; lfo.connect(lg); lg.connect(g.gain);
  lfo.start(t0); lfo.stop(t0 + dur + .05);
  notes.forEach(n => [-4, 4].forEach(det => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(n); o.detune.value = det; o.connect(f); o.start(t0); o.stop(t0 + dur + .05); }));
  f.connect(g); g.connect(MUSIC_GAIN);
}
function musicTick() {
  if (!MUS.on || !AC) return;
  const beat = 60 / 138;
  while (MUS.next < AC.currentTime + 0.6) {
    const b = MUS.bar % 16, t = MUS.next, ch = CHORDS[PROG[b]];
    tone(mtof(ch[0] - 12), t, beat * 0.9, { type: 'triangle', vol: .22, dest: MUSIC_GAIN });
    accordion(ch.slice(1), t + beat, beat * 0.7, .05);
    accordion(ch.slice(1), t + beat * 2, beat * 0.7, .05);
    let mt = t;
    MEL[b].forEach(([n, d]) => { tone(mtof(n), mt, beat * d * 0.95, { type: 'triangle', vol: .12, dest: MUSIC_GAIN }); tone(mtof(n + 12), mt, beat * 0.4, { type: 'sine', vol: .03, dest: MUSIC_GAIN }); mt += beat * d; });
    MUS.next += beat * 3; MUS.bar++;
  }
}
function setMusic(on) {
  if (!audio()) return;
  MUS.on = on;
  MUSIC_GAIN.gain.cancelScheduledValues(AC.currentTime);
  MUSIC_GAIN.gain.setTargetAtTime(on ? 0.55 : 0, AC.currentTime, 0.4);
  if (on && !MUS.timer) { MUS.next = AC.currentTime + 0.1; MUS.timer = setInterval(musicTick, 200); }
  if (!on && MUS.timer) { setTimeout(() => { if (!MUS.on) { clearInterval(MUS.timer); MUS.timer = null; } }, 1500); }
}

/* speech synthesis — slow and clear US English */
let VOICE = null;
function pickVoice() {
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices().filter(v => /en[-_]US/i.test(v.lang));
  const pref = ['Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Samantha', 'Microsoft Zira', 'Allison', 'Ava'];
  for (const p of pref) { const v = vs.find(v => v.name.includes(p)); if (v) return v; }
  return vs[0] || null;
}
if (window.speechSynthesis) { speechSynthesis.onvoiceschanged = () => { VOICE = pickVoice(); }; VOICE = pickVoice(); }
function speak(text, who) {
  if (!S.voice || !window.speechSynthesis || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, ', ').replace(/[“”]/g, '').replace(/↔/g, ''));
    u.lang = 'en-US'; u.rate = 0.8;
    const k = who && who.kind;
    u.pitch = ['girl', 'princess'].includes(k) ? 1.35 : ['boy', 'prince'].includes(k) ? 1.25 : ['gent', 'man', 'grandpa', 'king', 'chef', 'chefvip'].includes(k) ? 0.85 : 1.08;
    if (!VOICE) VOICE = pickVoice();
    if (VOICE) u.voice = VOICE;
    speechSynthesis.speak(u);
  } catch (e) { }
}

   ============================================================ */
function makeMember([kind, name, g], used) {
  const elder = kind === 'grandpa' || kind === 'grandma';
  let outfit; do { outfit = pick(OUTFITS); } while (used.has(outfit) && used.size < OUTFITS.length); used.add(outfit);
  return {
    kind, name, g, skin: pick(SKINS), hair: elder ? pick(['#d9d9d9', '#eeeeee', '#bfbfbf']) : pick(HAIRS),
    outfit: kind === 'chefvip' ? '#fdfdfd' : outfit, acc: pick(['#d6283f', '#f2b134', '#7a3fb5', '#2f9e8f', '#e86aa8', '#3d6fd6']),
    glasses: elder || (kind === 'man' && Math.random() < .3), cap: Math.random() < .5,
    scale: ['girl', 'boy', 'prince', 'princess'].includes(kind) ? 0.8 : 1
  };
}
function orderText(list) {
  if (list.length === 1) return list[0];
  if (list.length === 2) return list[0] + ' and ' + list[1];
  return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
}
function makeCustomers(n) {
  const vipN = n >= 8 ? 2 : 1;
  let best = null;
  for (let tries = 0; tries < 400; tries++) {
    const regs = shuffle(GROUPS).slice(0, n - vipN), vips = shuffle(VIPS).slice(0, vipN);
    const list = regs.map(g => ({ g, vip: false }));
    // VIPs never first, never next to each other
    const slots = shuffle(Array.from({ length: n - 1 }, (_, k) => k + 1));
    const chosen = [];
    for (const s of slots) { if (chosen.length === vipN) break; if (chosen.every(c => Math.abs(c - s) > 1)) chosen.push(s); }
    chosen.sort((a, b) => a - b).forEach((s, k) => list.splice(s, 0, { g: vips[k], vip: true }));
    let ok = true;
    for (let k = 1; k < list.length; k++) if (list[k].g.m.length === list[k - 1].g.m.length) ok = false;
    best = list; if (ok) break;
  }
  // unique orders
  const combos = [];
  const subsets = (arr, k, start = 0, acc = []) => { if (acc.length === k) { combos.push(acc.slice()); return; } for (let i = start; i < arr.length; i++) { acc.push(arr[i]); subsets(arr, k, i + 1, acc); acc.pop(); } };
  subsets(DISH_KEYS, 2); subsets(DISH_KEYS, 3);
  const seen = new Set();
  const signals = ['pause', 'finished', 'delicious'];
  let lastSig = null, rudeBag = [], lastRude = null;
  const out = best.map((it, idx) => {
    const used = new Set();
    const members = it.g.m.map(x => makeMember(x, used));
    let order, extra = null, key;
    for (let t = 0; t < 200; t++) {
      order = shuffle(pick(combos));
      extra = null;
      if (Math.random() < 0.5 && order.length < 4) { const left = DISH_KEYS.filter(d => !order.includes(d)); extra = pick(left); }
      key = order.concat(extra ? [extra] : []).sort().join('+');
      if (!seen.has(key)) break;
    }
    seen.add(key);
    order.sort((a, b) => DISH_KEYS.indexOf(a) - DISH_KEYS.indexOf(b));
    if (!rudeBag.length) rudeBag = shuffle(Object.keys(RUDE));
    let rude = rudeBag.pop();
    if (rude === lastRude && rudeBag.length) { rudeBag.unshift(rude); rude = rudeBag.pop(); }
    lastRude = rude;
    const polite = shuffle(Object.keys(POLITE).filter(p => !(rude === 'early' && p === 'wait'))).slice(0, 2);
    let sig; do { sig = pick(signals); } while (sig === lastSig);
    lastSig = sig;
    const sig2 = sig === 'pause' ? pick(['finished', 'delicious']) : null;
    const who = shuffle(members);
    return {
      name: it.g.name, vip: it.vip, vipTitle: it.g.title || '', members, order, extra, rude, polite, signal: sig, signal2: sig2,
      mannerWho: [who[0], who[1 % who.length], who[2 % who.length]], seats: null
    };
  });
  // make sure the game shows a PAUSE plate at least once
  if (!out.some(c => c.signal === 'pause') && out.length > 1) { const c = out[1]; c.signal2 = c.signal; c.signal = 'pause'; }
  return out;
}

function sortActors() {
  const sorted = actors.slice().sort((a, b) => a.depth - b.depth);
  sorted.forEach((a, k) => { if (ACT.children[k] !== a.g) ACT.appendChild(a.g); });
  // ensure DOM order matches
  let ok = true; sorted.forEach((a, k) => { if (ACT.children[k] !== a.g) ok = false; });
  if (!ok) sorted.forEach(a => ACT.appendChild(a.g));
}
function clearActors() { actors.slice().forEach(a => a.remove()); }

function moveActor(a, pts, speed, t) {
  // speed: iso units per second
  return new Promise((res, rej) => {
    const path = [{ i: a.i, j: a.j }].concat(pts);
    const segs = []; let total = 0;
    for (let k = 1; k < path.length; k++) { const d = Math.hypot(path[k].i - path[k - 1].i, path[k].j - path[k - 1].j); segs.push(d); total += d; }
    const dur = Math.max(0.2, total / speed) * 1000, t0 = performance.now();
    a.g.classList.add('walking');
    const step = now => {
      if (t !== undefined && t !== RUN) { a.g.classList.remove('walking'); return rej(CANCEL); }
      let f = Math.min(1, (now - t0) / dur), dist = f * total, k = 0;
      while (k < segs.length - 1 && dist > segs[k]) { dist -= segs[k]; k++; }
      const q = segs[k] ? dist / segs[k] : 1;
      a.i = path[k].i + (path[k + 1].i - path[k].i) * q; a.j = path[k].j + (path[k + 1].j - path[k].j) * q;
      a.place(); sortActors();
      if (f < 1) requestAnimationFrame(step); else { a.g.classList.remove('walking'); res(); }
    };
    requestAnimationFrame(step);
  });
}

function award(tries, from) {

    s.style.left = start.x - 30 + 'px'; s.style.top = start.y - 30 + 'px';
    $('#fxLayer').appendChild(s);
    const dx = target.x - start.x, dy = target.y - start.y;
    s.animate([{ transform: 'translate(0,0) scale(.6)', opacity: 0 }, { transform: `translate(${rnd(-60, 60)}px,${rnd(-90, -40)}px) scale(1.4)`, opacity: 1, offset: .25 }, { transform: `translate(${dx}px,${dy}px) scale(.7)`, opacity: 1 }],

/* ============================================================
   DRAG & DROP (pointer events: finger + mouse)
   ============================================================ */
function draggable(el, { ghost, onDrop, onTapItem, enabled = () => true }) {
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', e => {
    if (!enabled()) return;
    audio(); e.preventDefault();
    const id = e.pointerId; try { el.setPointerCapture(id); } catch (er) { }
    const start = toStage(e); let g = null;
    const move = ev => {
      if (ev.pointerId !== id) return;
      const p = toStage(ev);
      if (!g && Math.hypot(p.x - start.x, p.y - start.y) > 12) {
        g = document.createElement('div'); g.className = 'dragGhost'; g.innerHTML = ghost(); $('#dragLayer').appendChild(g); el.classList.add('dragging');
      }
      if (g) { g.style.left = p.x + 'px'; g.style.top = p.y + 'px'; }
    };
    const up = ev => {
      if (ev.pointerId !== id) return;
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      el.classList.remove('dragging');
      if (!g) { if (ev.type === 'pointerup' && onTapItem) onTapItem(); return; }
      const p = toStage(ev);
      const ok = ev.type === 'pointerup' ? onDrop(p) : false;
      if (ok) { g.remove(); return; }
      const back = elCenter(el);
      g.animate([{ left: p.x + 'px', top: p.y + 'px' }, { left: back.x + 'px', top: back.y + 'px' }], { duration: 420, easing: 'cubic-bezier(.3,1.4,.5,1)', fill: 'forwards' });
      setTimeout(() => g.remove(), 430);
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}

function goStep(k, opts = {}) {
  RUN++; const t = RUN;
  while (k < 8 && !S.steps[k]) k++;
  if (k >= 8) { nextCustomer(); return; }
  G.step = k;
  G.snap = { total: G.total, possible: G.possible, cust: G.custStars };
  updatePills(); updateStars(); updateCustCard();
  resetOverlays();
  const phase = PHASE_OF[k];
  if (opts.force || SC.cust !== G.idx || SC.phase !== phase) {
    if (phase === 'outside') { buildScene('outside'); }
    else buildScene(phase);
  }
  busy();
  const fn = STEP_FN[STEPS[k].key];
  fn(t).then(() => { if (t === RUN) goStep(k + 1); }).catch(e => { if (e !== CANCEL) console.error(e); });
}

  if (G.idx + 1 < G.customers.length) { G.idx++; startCustomer(); }

/* ---------- STEP 2: TABLE ---------- */
async function stepTable(t) {
  const c = cur(), n = c.members.length;
  say(`Hi, I would like a table for ${n} people.`, c.members[0]);
  instr('<span class="emo">🪑</span> Listen! Drag the right number of chairs to the table. Tap a chair to take it away.');
  $('#seatSpots').classList.remove('hidden');
  const placed = new Map();            // spot index -> actor
  area.innerHTML = `<div class="trayHead">Chair tray</div><div class="tray" style="top:40px;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)">${Array.from({ length: 8 }, (_, k) => `<div class="cell" data-k="${k}"><svg viewBox="-30 -92 60 100" width="110" height="170">${chairSVG(1)}</svg></div>`).join('')}</div>`;
  let locked = false;
  const cells = $$('.cell', area);
  const refreshTray = () => { const used = placed.size; cells.forEach((el, k) => el.classList.toggle('used', k >= 8 - used)); };
  const removeChair = k => { if (locked) return; const a = placed.get(k); if (!a) return; a.remove(); placed.delete(k); $(`.seatSpot[data-k="${k}"]`).classList.remove('taken'); SFX.pop(); refreshTray(); };
  const addChair = k => {
    const sp = SEAT_SPOTS[k];
    const a = new Actor(`<g class="chairActor fadeIn">${chairSVG(1)}</g>`, sp.i, sp.j, { dz: .1 });
    a.g.addEventListener('pointerdown', e => { e.stopPropagation(); removeChair(k); });
    placed.set(k, a); $(`.seatSpot[data-k="${k}"]`).classList.add('taken'); refreshTray();
  };
  cells.forEach(el => draggable(el, {
    enabled: () => !locked,
    ghost: () => `<svg viewBox="-30 -92 60 100" width="120" height="190">${chairSVG(1)}</svg>`,
    onDrop: p => {
      const sx = p.x, sy = p.y - SCENE_Y;
      let best = -1, bd = 1e9;
      SEAT_SPOTS.forEach((s, k) => { const q = iso(s.i, s.j); const d = Math.hypot(q.x - sx, q.y - 30 - sy); if (d < bd && !placed.has(k)) { bd = d; best = k; } });
      if (best < 0 || bd > 95) { instr('<span class="emo">👉</span> Drop the chair on a dotted spot by the table.'); return false; }
      addChair(best); SFX.ding(); const q = iso(SEAT_SPOTS[best].i, SEAT_SPOTS[best].j); sparkleAt(q.x, q.y - 40, 3);
      return true;
    }
  }));
  let tries = 0;
  while (true) {
    await waitAction('🪑 Seat the guests', t);
    if (placed.size === n) { tries++; break; }
    tries++;
    if (tries === 1) {
      SFX.bonk(); react('confused');
      say(placed.size < n ? `Hmm… we need more chairs. We are ${n} people!` : `Hmm… too many chairs! We are ${n} people.`, c.members[0]);
      instr(`<span class="emo">🤔</span> Try again! Count the people. ${placed.size < n ? 'Add' : 'Take away'} chairs.`, 'bad');
    } else {
      SFX.bonk(); react('confused');
      locked = true;
      // fix automatically
      while (placed.size > n) removeChairForce(placed);
      const want = defaultSeats(n);
      for (const k of want) { if (placed.size >= n) break; if (!placed.has(k)) addChair(k); }
      instr(`<span class="emo">💡</span> We need ${n} chairs for ${n} people.`, 'bad');
      tries = 3;
      await sleep(1800, t);
      break;
    }
  }
  locked = true;
  const pts = award(tries, elCenter(actionBtn));
  if (tries === 1) { SFX.cheer(); react('dance'); instr('<span class="emo">🎉</span> Perfect! ' + n + ' chairs for ' + n + ' people!', 'good'); }
  else if (tries === 2) { SFX.ding(); react('happy'); instr('<span class="emo">👍</span> Good job! ' + n + ' chairs!', 'good'); }
  area.innerHTML = '';
  $('#seatSpots').classList.add('hidden');
  c.seats = Array.from(placed.keys()).slice(0, n);
  await sleep(900, t);
  waiterSay('This way, please. Here is your table. Please have a seat. Here is your menu.');
  busy();
  // customers walk to their chairs and sit down
  const walks = c.members.map((m, k) => (async () => {
    const a = SC.people[k]; const sp = SEAT_SPOTS[c.seats[k]];
    await sleep(k * 250, t);
    await moveActor(a, [{ i: sp.i - 0.35, j: sp.j + 0.35 }], 1.8, t);
    a.remove();
    const chair = placed.get(c.seats[k]); if (chair) chair.remove();
    const s = new Actor(seatHTML(m), sp.i, sp.j, { dz: .1, cls: 'seatA' }); s.member = m; SC.seatActors[k] = s;
  })());
  SC.seatActors = [];
  await Promise.all(walks);
  SC.people = []; SC.phase = 'seated';
  await sleep(600, t);
  say('Thank you.', c.members[0]);
  react('happy');
  instr('<span class="emo">📜</span> The guests have their menus.');

/* ---------- STEP 4: UTENSILS ---------- */
function neededUtensils(c) {
  const all = c.order.concat(c.extra ? [c.extra] : []);
  const need = new Set(['napkin']);
  if (all.includes('steak')) { need.add('fork'); need.add('knife'); }
  if (all.includes('spaghetti')) need.add('fork');
  if (all.includes('salad')) need.add('saladFork');
  if (all.includes('soup')) need.add('soupSpoon');
  if (all.includes('cake')) need.add('dessertSpoon');
  if (all.includes('juice')) need.add('glass');
  return need;
}
function zoomIn(html) {
  const td = $('#topdown'); td.innerHTML = html;
  $('#sceneWrap').classList.add('zoom');
  return new Promise(r => setTimeout(() => { td.classList.add('show'); r(); }, 550));
}
function zoomOut() {
  $('#topdown').classList.remove('show');
  return new Promise(r => setTimeout(() => { $('#sceneWrap').classList.remove('zoom'); setTimeout(r, 900); }, 450));
}
function tdLabel(key, txt, life) {
  const sp = TD.spots[key];
  const d = document.createElement('div'); d.className = 'tdLabel'; d.textContent = txt;
  d.style.left = sp.x + 'px'; d.style.top = (sp.y + sp.h / 2 + (key === 'saladFork' || key === 'soupSpoon' ? 62 : 8)) + 'px';
  if (key === 'dessertSpoon' || key === 'glass') d.style.top = (sp.y - sp.h / 2 - 50) + 'px';

}

  area.innerHTML = `<div class="tray" style="grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)">${items.map(k => `<div class="cell" data-k="${k}"><svg viewBox="-60 -140 120 280" width="72" height="168">${UT[UT_DRAW[k]](sc[k] ? sc[k] / .62 : 1)}</svg><div class="lbl">${UTENSIL_INFO[k].name}</div></div>`).join('')}</div>`;
  const tries = {}, done = new Set();

  const placeIt = key => {
    done.add(key);

    $(`.cell[data-k="${key}"]`, area).classList.add('used');
    $(`.tdSpot[data-key="${key}"]`).classList.remove('point');
  };
  const nearestSpot = p => {
    const x = p.x, y = p.y - SCENE_Y; let best = null, bd = 1e9;
    for (const [k, s] of Object.entries(TD.spots)) {
      const dx = Math.max(0, Math.abs(x - s.x) - s.w / 2), dy = Math.max(0, Math.abs(y - s.y) - s.h / 2);
      const d = Math.hypot(dx, dy) + Math.hypot(x - s.x, y - s.y) * 0.01;
      if (d < bd) { bd = d; best = k; }
    }
    return bd < 50 ? best : null;
  };
  $$('.cell', area).forEach(el => {
    const key = el.dataset.k;
    draggable(el, {
      enabled: () => !done.has(key),
      ghost: () => `<svg viewBox="-60 -140 120 280" width="120" height="280">${UT[UT_DRAW[key]](1)}</svg>`,
      onTapItem: () => { speak(UTENSIL_INFO[key].name, CHEF); el.classList.remove('tapped'); void el.offsetWidth; el.classList.add('tapped'); },
      onDrop: p => {

        if (spot === key) {

          placeIt(key); SFX.ding(); sparkleAt(TD.spots[key].x, TD.spots[key].y, 6);

          const p2 = award(tries[key], { x: TD.spots[key].x, y: TD.spots[key].y + SCENE_Y });
          if (tries[key] > 1) firstAll = false;
          points += p2; react('happy');
          instr(key === 'napkin' ? '<span class="emo">👍</span> Yes! The guest puts the napkin on the lap.' : `<span class="emo">👍</span> Yes! ${info.explain}`, 'good');
          return true;
        }
        tries[key] = (tries[key] || 0) + 1; firstAll = false;
        SFX.bonk(); react('confused');
        if (tries[key] >= 2) {
          placeIt(key); tdLabel(key, info.name, 2600); award(3);
          instr(`<span class="emo">💡</span> ${info.explain}`, 'bad'); say(info.explain, lead);
          return true;
        }
        say(info.hint, lead); instr('<span class="emo">🤔</span> Try again!', 'bad');
        return false;
      }
    });
  });
  while (true) {
    await waitAction('✅ Table ready!', t);
    const missing = Array.from(need).filter(k => !done.has(k));
    if (!missing.length) break;
    SFX.bonk(); react('confused');
    $$('.tdSpot').forEach(s => s.classList.remove('point'));
    missing.forEach(k => $(`.tdSpot[data-key="${k}"]`).classList.add('point'));
    const sp = TD.spots[missing[0]];
    fx('pointHand', sp.x - sp.w / 2 - 10, sp.y, '👉', 2600);
    say(`Excuse me… I need a ${UTENSIL_INFO[missing[0]].name} here!`, lead);
    instr(`<span class="emo">👉</span> Something is missing! Look at the red spot${missing.length > 1 ? 's' : ''}.`, 'bad');
  }
  busy();
  if (firstAll) { SFX.cheer(); react('dance'); }
  else { SFX.ding(); react('happy'); }
  $$('.tdSpot').forEach(s => { if (!done.has(s.dataset.key)) s.style.opacity = '.25'; });
  done.forEach(k => tdLabel(k, UTENSIL_INFO[k].name));
  area.innerHTML = '';
